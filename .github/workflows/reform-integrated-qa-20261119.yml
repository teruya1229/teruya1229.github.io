name: Reform LP integrated production Chrome QA
on:
  push:
    branches: [qa/reform-integrated-20261119]
    paths: [.github/workflows/reform-integrated-qa-20261119.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese fonts and browser test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Inspect real public LP on PC and two phone widths
        shell: bash
        run: |
          mkdir -p /tmp/reform-qa
          node <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const results=[];
            try{
              for(const width of [1440,390,320]){
                const ctx=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
                const page=await ctx.newPage();
                const bad=[],errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                page.on('response',r=>{if(r.url().startsWith('https://teruya1229.github.io/')&&r.status()>=400)bad.push(r.status()+' '+r.url())});
                await page.route('**/*',r=>{const u=r.request().url();return u.startsWith('https://teruya1229.github.io/')||u.startsWith('data:')?r.continue():r.abort('blockedbyclient')});
                const response=await page.goto('https://teruya1229.github.io/reform/',{waitUntil:'domcontentloaded',timeout:45000});
                await page.locator('img').evaluateAll(e=>e.forEach(i=>i.loading='eager'));
                await page.evaluate(async()=>{
                  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
                  for(let y=0;y<document.documentElement.scrollHeight;y+=600){scrollTo(0,y);await new Promise(r=>setTimeout(r,20))}
                  scrollTo(0,0);
                });
                await page.waitForTimeout(550);
                const data=await page.evaluate(()=>{
                  const out=[...document.querySelectorAll('h1,h2,h3,p,a,button,summary')].filter(e=>e.getClientRects().length>0).map(e=>({text:(e.innerText||'').slice(0,60),r:e.getBoundingClientRect()})).filter(x=>x.r.width>0 && (x.r.left<-3||x.r.right>innerWidth+3)).slice(0,10);
                  return {viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight,img:[...document.images].map(e=>({src:e.getAttribute('src'),ok:e.complete&&e.naturalWidth>0})),faqs:document.querySelectorAll('#faq details').length,line:document.querySelectorAll('a[href*="lin.ee"]').length,phone:document.querySelectorAll('a[href^="tel:"]').length,externalReview:document.querySelectorAll('a[href*="curama.jp"]').length,head:document.querySelector('h1')?.innerText,font:document.fonts.check('16px "Noto Sans CJK JP"','日本語'),outOfBounds:out};
                });
                await page.screenshot({path:'/tmp/reform-qa/live-'+width+'-full.png',fullPage:true,animations:'disabled',timeout:60000});
                const faqs=page.locator('#faq details');
                for(let i=0;i<await faqs.count();i++){
                  const el=faqs.nth(i),before=await el.evaluate(e=>e.open);
                  await el.locator('summary').click();
                  if((await el.evaluate(e=>e.open))===before)errors.push('FAQ_NO_TOGGLE_'+i);
                  await el.locator('summary').click();
                  if((await el.evaluate(e=>e.open))!==before)errors.push('FAQ_NO_RESTORE_'+i);
                }
                results.push({width,http:response.status(),...data,bad,errors});
                await ctx.close();
              }
              fs.writeFileSync('/tmp/reform-qa/report.json',JSON.stringify(results,null,2));
              console.log(JSON.stringify(results,null,2));
              if(results.some(x=>x.http!==200||x.viewport!==x.scrollWidth||x.img.some(i=>!i.ok)||x.faqs!==8||x.line!==6||x.phone!==5||x.bad.length||x.errors.length||x.outOfBounds.length))process.exitCode=1;
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reform-live-qa-20261119
          path: /tmp/reform-qa/
          if-no-files-found: warn
