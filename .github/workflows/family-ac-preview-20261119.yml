name: Family AC LP two-axis Chrome preview QA 20261119
on:
  push:
    branches: [improve/aircon-family-proof-20261119]
    paths: [.github/workflows/family-ac-preview-20261119.yml, qa/family-ac-preview-20261119.cjs]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Japanese font and Chrome QA
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Compare before and after on three widths
        run: node qa/family-ac-preview-20261119.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: family-ac-preview-20261119, path: qa-family-aircon/, if-no-files-found: warn}
