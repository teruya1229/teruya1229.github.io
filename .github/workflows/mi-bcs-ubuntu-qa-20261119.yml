name: MI.BCS seller LP Linux Chrome QA fallback
on:
  push:
    branches: [improve/mi-bcs-sales-faq-trust-20261119]
    paths:
      - .github/workflows/mi-bcs-ubuntu-qa-20261119.yml
      - qa/mi-bcs-20261119.cjs
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Japanese QA font and Playwright
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          fc-match ':lang=ja' family | head -1
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Compare current public source and preview at three breakpoints
        run: |
          sed -i "s/chromium.launch({headless:true})/chromium.launch({headless:true,channel:'chrome'})/" qa/mi-bcs-20261119.cjs
          node qa/mi-bcs-20261119.cjs
      - name: Archive proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-bcs-linux-qa-20261119
          path: qa-mi-bcs/
          if-no-files-found: warn
