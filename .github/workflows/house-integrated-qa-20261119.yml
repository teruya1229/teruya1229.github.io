name: House cleaning integrated Chrome QA
on:
  push:
    branches: [improve/house-cleaning-trust-20261119]
    paths:
      - house-cleaning/**
      - .github/workflows/house-integrated-qa-20261119.yml
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese fonts and Chrome automation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Compare site design and conversion paths at three widths
        shell: bash
        run: |
          mkdir -p /tmp/house-qa
          node <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const report=[];
            try{
              for(const width of [1440,390,320]){
                const context=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
                const page=await context.newPage();
                const errors=[],bad=[];
                page.on('pageerror',e=>errors.push(e.message));
                page.on('response',r=>{if(r.url().startsWith('https://teruya1229.github.io/')&&r.status()>=400)bad.push(r.status()+' '+r.url())});
                await page.route('**/*',route=>{const u=route.request().url();return u.startsWith('https://teruya1229.github.io/')||u.startsWith('data:')?route.continue():route.abort('blockedbyclient')});
                const response=await page.goto('https://teruya1229.github.io/house-cleaning/',{waitUntil:'domcontentloaded',timeout:45000});
                await page.locator('img').evaluateAll(img=>img.forEach(i=>i.loading='eager'));
                await page.evaluate(async()=>{await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await new Promise(r=>setTimeout(r,15))};scrollTo(0,0)});
                await page.waitForTimeout(400);
                const info=await page.evaluate(()=>{
                  const all=[...document.querySelectorAll('h1,h2,h3,a,button,summary')].filter(e=>e.getClientRects().length).map(e=>({text:(e.innerText||'').slice(0,35),r:e.getBoundingClientRect()})).filter(o=>o.r.left<-3||o.r.right>innerWidth+3).slice(0,15);
                  return {title:document.title,viewport:innerWidth,width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight,images:[...document.images].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0})),faqs:document.querySelectorAll('#faq details').length,line:[...document.querySelectorAll('a[href*="lin.ee"]')].length,reviewSource:document.querySelectorAll('a[href*="curama.jp"]').length,headline:document.querySelector('h1')?.innerText,outside:all,font:document.fonts.check('16px "Noto Sans CJK JP"','日本語')};
                });
                await page.screenshot({path:'/tmp/house-qa/house-'+width+'-full.png',fullPage:true,animations:'disabled',timeout:60000});
                const faq=page.locator('#faq details');
                for(let i=0;i<await faq.count();i++){await faq.nth(i).locator('summary').click();if(!(await faq.nth(i).evaluate(e=>e.open)))errors.push('FAQ '+i);await faq.nth(i).locator('summary').click()}
                report.push({width,http:response.status(),...info,errors,bad});
                await context.close();
              }
              fs.writeFileSync('/tmp/house-qa/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
              if(report.some(x=>x.http!==200||x.width!==x.viewport||x.images.some(i=>!i.loaded)||x.outside.length||x.errors.length||x.bad.length||x.faqs!==10))process.exitCode=1;
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-cleaning-visual-20261119
          path: /tmp/house-qa/
          if-no-files-found: warn
