name: Tomigusuku LP before after Chrome review 20261119
on:
  push:
    branches: [improve/tomigusuku-two-axis-20261119]
    paths: [.github/workflows/tomigusuku-review-20261119.yml, cursor-test/tomigusuku.html]
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Japanese font and browser test setup
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Compare live base and branch in Chrome
        run: node qa/tomigusuku-preview-20261119.cjs
      - name: Save full-page before/after images
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: tomigusuku-preview-20261119, path: qa-tomigusuku-preview/, if-no-files-found: warn}
