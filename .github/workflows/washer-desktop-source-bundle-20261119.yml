name: Washer desktop source bundle for Japanese font QA
on:
  push:
    branches: [fix/washer-desktop-spacious-layout-20261119]
    paths: ['.github/workflows/washer-desktop-source-bundle-20261119.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bundle only three revised markup and CSS sources
        run: |
          tar -czf "${RUNNER_TEMP}/washer-desktop-source.tgz" washing-machine-cleaning/index.html washing-machine-cleaning/assets/washing.css washing-machine-cleaning/assets/diagnosis.css
      - name: Archive for local Japanese-font visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: washer-desktop-source-20261119
          path: ${{ runner.temp }}/washer-desktop-source.tgz
