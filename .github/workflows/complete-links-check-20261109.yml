name: Complete disassembly related links QA 20261109
on:
  push:
    branches: [feat/complete-links-cleanup-20261109]
    paths:
      - complete-disassembly/index.html
      - .github/workflows/complete-links-check-20261109.yml
permissions:
  contents: read
jobs:
  link-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify reciprocal links and widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/complete-links-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const outcomes=[];
            try{
              for(const width of [1440,820,390,320]){
                const ctx=await b.newContext({viewport:{width,height:900}});
                const page=await ctx.newPage();
                await page.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:8765/')?r.continue():r.abort('blockedbyclient'));
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const response=await page.goto('http://127.0.0.1:8765/complete-disassembly/',{waitUntil:'domcontentloaded',timeout:30000});
                if(response.status()!==200)throw Error('LOCAL_HTTP_'+response.status());
                const facts=await page.evaluate(()=>{
                  const header=document.querySelector('.header');
                  const nav=header.querySelector('.header-nav');
                  const anchors=Array.from(document.querySelectorAll('a'));
                  const get=(href)=>anchors.filter(a=>a.getAttribute('href')===href).map(a=>a.textContent.trim());
                  return {
                    logo:header.querySelector('a.logo')?.getAttribute('href'),
                    nav:Array.from(nav.querySelectorAll('a')).map(a=>({text:a.textContent.trim(),href:a.getAttribute('href')})),
                    aircon:get('/aircon/'),
                    replacement:get('/mi-bcs/aircon-replacement/'),
                    cursor:get('../cursor-test/'),
                    line:get('https://lin.ee/tsilra6').length,
                    icons:document.querySelectorAll('img[src*="/assets/icons/"]').length,
                    parts:document.querySelectorAll('img[src="./assets/photos/parts-ready-560.webp"]').length,
                    comparison:document.querySelectorAll('.sec-beforeafter-refresh img.svc-card-img').length,
                    pageWidth:document.documentElement.scrollWidth,
                    viewport:window.innerWidth,
                    navWidth:nav.scrollWidth,
                    navClient:nav.clientWidth
                  };
                });
                if(facts.logo!=='/')throw Error('LOGO_NOT_ROOT '+JSON.stringify(facts));
                if(!facts.nav.some(x=>x.text==='エアコン総合'&&x.href==='/aircon/'))throw Error('NAV_NOT_AIRCON '+JSON.stringify(facts.nav));
                if(!facts.nav.some(x=>x.text==='家庭向けLP'&&x.href==='../cursor-test/'))throw Error('LEGACY_MISSING');
                if(!facts.aircon.includes('エアコンのお悩み総合案内'))throw Error('AIRCON_BODY_LINK_MISSING');
                if(!facts.replacement.includes('新品エアコンの販売・取付'))throw Error('REPLACEMENT_BODY_LINK_MISSING');
                if(facts.line<4 || facts.icons!==12 || facts.parts!==1 || facts.comparison!==2)throw Error('REGRESSION '+JSON.stringify(facts));
                if(facts.pageWidth>facts.viewport)throw Error('OVERFLOW '+JSON.stringify(facts));
                if(errors.length)throw Error('JS_ERRORS '+JSON.stringify(errors));
                fs.mkdirSync('qa-links',{recursive:true});
                await page.locator('.header').screenshot({path:'qa-links/header-'+width+'.png'});
                await page.locator('a[href="/mi-bcs/aircon-replacement/"]').screenshot({path:'qa-links/body-replacement-'+width+'.png'});
                outcomes.push({width,status:'PASS',pageWidth:facts.pageWidth,anchors:4,icons:facts.icons,errors:0});
                await ctx.close();
              }
              const api=await b.newContext();
              const urls=[
                ['BC root','https://teruya1229.github.io/'],
                ['Aircon hub','https://teruya1229.github.io/aircon/'],
                ['Existing clean LP','https://teruya1229.github.io/cursor-test/'],
                ['Replacement','https://teruya1229.github.io/mi-bcs/aircon-replacement/']
              ];
              const destinations=[];
              for(const [label,url] of urls){
                const r=await api.request.get(url,{timeout:25000});
                if(r.status()!==200)throw Error('DESTINATION '+label+' '+r.status());
                destinations.push({label,status:r.status(),url});
              }
              await api.close();
              const hub=await b.newContext();
              const page=await hub.newPage();
              await page.goto('https://teruya1229.github.io/aircon/',{waitUntil:'domcontentloaded',timeout:25000});
              if(await page.locator('a[href="https://teruya1229.github.io/complete-disassembly/"]').count()<1)throw Error('INBOUND_FROM_AIRCON_MISSING');
              await page.goto('https://teruya1229.github.io/mi-bcs/aircon-replacement/',{waitUntil:'domcontentloaded',timeout:25000});
              if(await page.locator('a[href="https://teruya1229.github.io/complete-disassembly/"]').count()<1)throw Error('INBOUND_FROM_REPLACEMENT_MISSING');
              await hub.close();
              console.log('COMPLETE_LINKS_QA '+JSON.stringify({status:'PASS',widths:outcomes,destinations,reciprocal:'PASS'}));
            } finally {await b.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-related-links-predeploy-qa
          path: qa-links/
          if-no-files-found: ignore
