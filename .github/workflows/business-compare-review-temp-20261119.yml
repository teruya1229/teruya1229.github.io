name: Business LP comparison copy temporary visual QA
on:
  push:
    branches: [improve/business-cleaning-compare-20261119]
    paths:
      - 'business-cleaning/**'
      - '.github/workflows/business-compare-review-temp-20261119.yml'
permissions:
  contents: read
jobs:
  copy-visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up isolated QA browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          google-chrome --version
      - name: Inspect business landing page at 1440, 390 and 320
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bc-business-review.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const BASE='http://127.0.0.1:8765';
          const results=[];
          const errors=[];
          fs.mkdirSync('qa-business',{recursive:true});
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true});
            try{
              for(const width of [1440,390,320]){
                const context=await browser.newContext({viewport:{width,height:860},deviceScaleFactor:1,reducedMotion:'reduce'});
                const page=await context.newPage();
                const pageErrors=[];
                const badLocal=[];
                page.on('pageerror',e=>pageErrors.push(e.message));
                page.on('response',r=>{
                  if(r.url().startsWith(BASE) && r.status()>=400)badLocal.push({url:r.url(),status:r.status()});
                });
                await page.route('**/*',route=>{
                  if(route.request().url().startsWith(BASE))return route.continue();
                  return route.abort('blockedbyclient');
                });
                const response=await page.goto(BASE+'/business-cleaning/',{waitUntil:'domcontentloaded',timeout:30000});
                await page.locator('img[src]').evaluateAll(els=>els.forEach(x=>x.loading='eager'));
                await page.waitForTimeout(900);
                const stats=await page.evaluate(async()=>{
                  const im=await Promise.all([...document.querySelectorAll('img[src]')].map(async x=>{
                    try{await x.decode();}catch(e){}
                    return {src:x.getAttribute('src'),ok:x.complete&&x.naturalWidth>0};
                  }));
                  const box=(sel)=>{const x=document.querySelector(sel);if(!x)return null;const r=x.getBoundingClientRect();return {x:r.left,y:r.top,width:r.width,height:r.height,scrollWidth:x.scrollWidth,clientWidth:x.clientWidth,text:x.textContent.trim(),display:getComputedStyle(x).display,visibility:getComputedStyle(x).visibility}};
                  return {
                    innerWidth:window.innerWidth,documentWidth:document.documentElement.scrollWidth,
                    scrollOverflow:document.documentElement.scrollWidth>window.innerWidth+1,
                    images:im,benefitTitle:box('#benefits .biz3-benefit-item:nth-child(3) h3'),
                    quoteHeading:box('#estimate .biz3-quote-heading'),
                    quoteLead:box('#estimate .biz3-quote-lead'),
                    quoteButton:box('#estimate .biz3-line-primary'),
                    cssLoaded:[...document.styleSheets].map(x=>x.href).filter(Boolean),
                    customerReviewLinks:[...document.querySelectorAll('a[href*="curama.jp/"]')].length,
                    lineLinks:[...document.querySelectorAll('a[href^="https://lin.ee/"]')].length,
                    telLinks:[...document.querySelectorAll('a[href^="tel:"]')].length,
                    faq:document.querySelectorAll('#faq details').length,
                    markupTracksBusiness:document.documentElement.outerHTML.includes('business_contact_click'),
                    hasPromo:document.body.innerText.includes('初回剥離ワックス半額')
                  };
                });
                const qa=page.locator('#faq details').first();
                await qa.locator('summary').click();
                const open=await qa.evaluate(x=>x.open);
                await qa.locator('summary').click();
                const closed=!(await qa.evaluate(x=>x.open));
                await page.locator('#benefits').screenshot({path:'qa-business/benefits-'+width+'.png',timeout:25000});
                await page.locator('#estimate').screenshot({path:'qa-business/estimate-'+width+'.png',timeout:25000});
                await page.locator('.biz3-hero').screenshot({path:'qa-business/hero-'+width+'.png',timeout:25000});
                const pass=response.status()===200 && !stats.scrollOverflow &&
                  stats.images.length>=6 && stats.images.every(x=>x.ok) &&
                  stats.benefitTitle && stats.benefitTitle.text.includes('今の清掃と比較') &&
                  stats.quoteHeading && stats.quoteHeading.text.includes('まずは見積りで比較') &&
                  stats.quoteLead && stats.quoteLead.text.includes('今の清掃会社を変えると決めていなくても') &&
                  stats.benefitTitle.clientWidth===stats.benefitTitle.scrollWidth &&
                  stats.quoteHeading.clientWidth===stats.quoteHeading.scrollWidth &&
                  stats.lineLinks>=3 && stats.telLinks>=1 && stats.customerReviewLinks>=8 &&
                  stats.faq===7 && stats.markupTracksBusiness && !stats.hasPromo &&
                  open && closed && pageErrors.length===0 && badLocal.length===0;
                results.push({width,pass,http:response.status(),open,closed,...stats,pageErrors,badLocal});
                if(!pass)errors.push(width);
                await context.close();
              }
              fs.writeFileSync('qa-business/RESULTS.json',JSON.stringify(results,null,2));
              console.log('BC_BUSINESS_VISUAL_QA_RESULTS='+JSON.stringify(results.map(x=>({width:x.width,pass:x.pass,images:x.images.length,overflow:x.scrollOverflow,faq:x.faq,open:x.open,closed:x.closed,errors:x.pageErrors.length,localErrors:x.badLocal.length,benefitWidth:x.benefitTitle?.width,headingWidth:x.quoteHeading?.width}))));
              if(errors.length)throw new Error('BUSINESS_VISUAL_QA_FAILED '+errors.join(','));
              console.log('BC_BUSINESS_VISUAL_QA_PASS_ALL');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Store visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-business-compare-qa-20261119
          path: qa-business/
          if-no-files-found: warn
