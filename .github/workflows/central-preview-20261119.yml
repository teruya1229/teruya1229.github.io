name: Central LP before after Japanese Chrome 20261119
on:
  push:
    branches: [improve/central-two-axis-20261119]
    paths: [.github/workflows/central-preview-20261119.yml, cursor-test/central.html]
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Japanese Noto and Playwright
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Compare old and updated central page in Chrome
        run: node qa/central-preview-20261119.cjs
      - name: Save before and after full-page images
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: central-preview-20261119, path: qa-central-preview-20261119/, if-no-files-found: warn}
