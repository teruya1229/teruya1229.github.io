name: One-time Business LP hero image optimization

on:
  push:
    branches:
      - feat/business-lp-speed-20261118
    paths:
      - .github/workflows/tmp-business-hero-opt-20261118.yml

permissions:
  contents: write

jobs:
  optimize-hero:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Produce efficient lossless-layout hero WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/bc-hero-venv
          /tmp/bc-hero-venv/bin/pip install --disable-pip-version-check Pillow==11.3.0
          /tmp/bc-hero-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          original=Path('business-cleaning/business-work-scene-optimized.jpg')
          target=Path('business-cleaning/business-work-scene-960.webp')
          with Image.open(original) as source:
              image=ImageOps.exif_transpose(source).convert('RGB')
          original_dimensions=image.size
          image.thumbnail((960,1280),Image.Resampling.LANCZOS)
          image.save(target,format='WEBP',quality=78,method=6)
          byte_count=target.stat().st_size
          if byte_count>180000:
              image.save(target,format='WEBP',quality=68,method=6)
              byte_count=target.stat().st_size
          assert target.exists() and byte_count>10000 and byte_count<180000,byte_count
          assert image.size[0]>=600 and image.size[1]>=800,image.size
          with Image.open(target) as test:
              test.load()
              assert test.size==image.size
          print('HERO_OPTIMIZED original_bytes=%s original_size=%s new_bytes=%s new_size=%s reduction_percent=%.1f' % (original.stat().st_size,original_dimensions,byte_count,image.size,100*(1-byte_count/original.stat().st_size)))
          PY
      - name: Commit image only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-cleaning/business-work-scene-960.webp
          if git diff --cached --quiet; then
            echo "Hero asset already present"
            exit 0
          fi
          git commit -m "Optimize Business LP hero photo to 960px WebP"
          git push origin HEAD:refs/heads/feat/business-lp-speed-20261118
