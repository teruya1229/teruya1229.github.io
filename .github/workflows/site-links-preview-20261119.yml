name: Cross-LP links before after Chrome 20261119
on:
  push:
    branches: [improve/site-crosslinks-20261119]
    paths: [.github/workflows/site-links-preview-20261119.yml, qa/site-links-preview-20261119.cjs, index.html, house-cleaning/index.html, cursor-test/index.html]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Japanese font and Playwright
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Verify 70 HTML links and 3 modified pages at 3 widths
        run: node qa/site-links-preview-20261119.cjs
      - name: Save before-after images and report
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: crosslink-preview-20261119, path: qa-site-links-preview-20261119/, if-no-files-found: warn}
