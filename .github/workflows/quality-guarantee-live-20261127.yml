name: BC portrait geometry QA
on:
  push:
    branches: [qa/quality-guarantee-live-20261127]
    paths: [.github/workflows/quality-guarantee-live-20261127.yml]
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify source
        run: |
          git worktree add --detach "$RUNNER_TEMP/portrait-qa" 30f43c2cdcc283859118811f964fac6f9553dbf0
          cd "$RUNNER_TEMP/portrait-qa"
          python .github/scripts/render_quality_guarantee.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Browser test
        env:
          SOURCE_DIR: ${{ runner.temp }}/portrait-qa
          QA_MODE: preview
        run: |
          cat > qa-portrait.cjs <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path');
          const root='https://teruya1229.github.io/',dir=process.env.SOURCE_DIR,mode=process.env.QA_MODE,assert=(v,m)=>{if(!v)throw Error(m)};
          const pages=['lighting/','toilet/','washlet/','reform/','mi-bcs/','mi-bcs/aircon-replacement/','moving/','washing-machine-cleaning/','business-cleaning/','aircon/','cursor-test/','complete-disassembly/',''];
          fs.mkdirSync('portrait-qa',{recursive:true});
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});const rows=[];try{
          for(const page of pages){for(const width of page==='lighting/'?[320,390,768,850,1024,1440]:[390,850,1440]){
          const ctx=await b.newContext({viewport:{width,height:900},deviceScaleFactor:1});
          try{await ctx.route('**/*',async route=>{const u=new URL(route.request().url());if(u.origin!=='https://teruya1229.github.io'||route.request().method()!=='GET')return route.abort();if(mode==='live')return route.continue();let pp=path.resolve(dir,'.'+decodeURIComponent(u.pathname));if(!pp.startsWith(dir+path.sep)&&pp!==dir)return route.abort();try{if(fs.statSync(pp).isDirectory())pp=path.join(pp,'index.html');return route.fulfill({path:pp})}catch{return route.fulfill({status:404,body:'missing'})}});
          const p=await ctx.newPage();const res=await p.goto(root+page,{waitUntil:'domcontentloaded',timeout:30000});assert(res.status()===200,'HTTP '+page);
          const imgs=p.locator('img[src*="rep-teruya"],img[src*="teruya-profile"],img[src*="profile-teruya"]');
          const portraits=await imgs.evaluateAll(async es=>{es.forEach(e=>e.loading='eager');await Promise.all(es.map(e=>e.decode().catch(()=>{})));return es.map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {src:e.getAttribute('src'),w:r.width,h:r.height,nw:e.naturalWidth,nh:e.naturalHeight,fit:s.objectFit,display:s.display,position:s.objectPosition,ratio:r.height?r.width/r.height:null}})});
          const row={page,width,portraits};if(page==='lighting/'){
          const photo=p.locator('.hero-person-photo');assert(await photo.count()===1,'portrait missing');const g=portraits[0];assert(g.nw>0&&g.nh>0&&g.fit==='contain'&&g.w>=85&&g.w<=157&&Math.abs(g.w-g.h)<2,'portrait cropped or oversize '+JSON.stringify(g));
          assert(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'horizontal scroll');
          const card=p.locator('.hero-frame--person');assert(await card.count()===1,'card missing');const box=await card.boundingBox();assert(box.width<=513,'oversize card '+box.width);await card.screenshot({path:'portrait-qa/lighting-'+width+'.png',animations:'disabled'});
          if(width===390){const images=await p.locator('#lighting-work-photos img').evaluateAll(async es=>{es.forEach(e=>e.loading='eager');await Promise.all(es.map(e=>e.decode()));return es.map(e=>e.naturalWidth)});assert(images.length===6&&images.every(x=>x>0),'work photos regression');row.workPhotos=6;}
          }else{row.suspicious=portraits.filter(g=>g.w>0&&g.h>0&&g.fit==='cover'&&g.nw>0&&g.nh>0&&(g.ratio/(g.nw/g.nh)>1.4||g.ratio/(g.nw/g.nh)<0.71));}
          rows.push(row);console.log('PORTRAIT_CASE '+JSON.stringify(row));
          }finally{await ctx.close()}
          }}}finally{await b.close()}fs.writeFileSync('portrait-qa/results.json',JSON.stringify(rows,null,2));console.log('PORTRAIT_SUMMARY '+JSON.stringify({mode,cases:rows.length,lighting:rows.filter(r=>r.page==='lighting/').length,suspicious:rows.filter(r=>r.suspicious?.length).map(r=>({page:r.page,width:r.width,images:r.suspicious}))}))})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check qa-portrait.cjs
          node qa-portrait.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-geometry-qa
          path: portrait-qa/
          retention-days: 7
          if-no-files-found: warn
