name: BC work-video restoration layout and evidence QA
on:
  push:
    branches: [qa/quality-guarantee-live-20261127]
    paths: [.github/workflows/quality-guarantee-live-20261127.yml]
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify source
        run: |
          git worktree add --detach "$RUNNER_TEMP/video-qa" 276b4973d2ff2ae73818584cd33bd2e0304c3eca
          cd "$RUNNER_TEMP/video-qa"
          python .github/scripts/render_quality_guarantee.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Verify video presence, size, order and direct links (external playback separately)
        env:
          SOURCE_DIR: ${{ runner.temp }}/video-qa
          QA_MODE: preview
        run: |
          cat > qa-video.cjs <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path'),cp=require('child_process');
          const root='https://teruya1229.github.io/',dir=process.env.SOURCE_DIR,mode=process.env.QA_MODE||'preview';
          const changed=['cursor-test/index.html','cursor-test/central.html','complete-disassembly/index.html','business-cleaning/index.html','moving/index.html','cursor-test/cases.html'];
          const city={'naha':'45nbeuVxRSk','nanjo':'ETByM3P35jk','yaese':'tY_QGWpMrOM','haebaru':'1ZQZzwoAtJY','itoman':'-pD6oKVSXdY','tomigusuku':'FKww4leiw8o','yonabaru':'ch9F4yll0AE'};
          const pages=[
           {file:changed[0],yt:['45nbeuVxRSk','OjCx-B5GCvU'],ig:['DKwmGaGTs48'],section:'#premium-video',home:true},
           {file:changed[1],yt:['45nbeuVxRSk'],ig:['DKwmGaGTs48'],section:'#premium-video',home:true},
           {file:changed[2],yt:['SMKg-3BL1ew','6UtKuOaCOZE'],ig:[],section:'#work-videos'},
           {file:changed[3],yt:[],ig:['DMh62EjPcNu'],section:'#work-video'},
           {file:changed[4],yt:['6UtKuOaCOZE'],ig:[],section:'#moving-work-video'},
           {file:changed[5],yt:[],ig:['DKwmGaGTs48','DO-xQ_PkUDL','DVvg1-tCP9I','DMCf9MEx_zN']},
           {file:'washing-machine-cleaning/index.html',yt:['OjCx-B5GCvU'],ig:[],section:'#movie'},
           ...Object.entries(city).map(([k,v])=>({file:'cursor-test/'+k+'.html',yt:[v],ig:[],section:'#regional-work-example'}))
          ];
          const assert=(v,m)=>{if(!v)throw Error(m)},same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const norm=s=>s.replace(/\r\n/g,'\n').trim(),tags=(s,r)=>Array.from(s.matchAll(r),m=>m[0]).sort();
          const get=f=>fs.readFileSync(path.join(dir,f),'utf8'),old=f=>cp.execFileSync('git',['show','c697f4c53f3ea61451f4a8287e1c56ae6bde3116:'+f],{encoding:'utf8',maxBuffer:8*1024*1024});
          assert(same(cp.execFileSync('git',['diff','--name-only','c697f4c53f3ea61451f4a8287e1c56ae6bde3116','276b4973d2ff2ae73818584cd33bd2e0304c3eca'],{encoding:'utf8'}).trim().split('\n').sort(),[...changed].sort()),'changed paths');
          for(const f of changed){
           const a=old(f),b=get(f);for(const re of [/<img\b[^>]*>/gi,/<script\b[\s\S]*?<\/script>/gi,/<!-- BCQ:(?:CSS|HERO|DETAIL):BEGIN -->[\s\S]*?<!-- BCQ:(?:CSS|HERO|DETAIL):END -->/g,/<a\b[^>]*href=["'](?:https?:\/\/(?:lin\.ee|line\.me|airrsv\.net)|tel:)[^"']*["'][^>]*>[\s\S]*?<\/a>/gi])assert(same(tags(a,re),tags(b,re)),f+' protected '+re);
           const ids=s=>[...new Set(Array.from(s.matchAll(/(?:youtube(?:-nocookie)?\.com\/(?:embed\/|shorts\/|watch\?v=)|youtu\.be\/)([A-Za-z0-9_-]{11})|instagram\.com\/(?:p|reel|tv)\/([A-Za-z0-9_-]+)/g),m=>m[1]||m[2]))];
           assert(ids(a).every(v=>ids(b).includes(v)),f+' lost original media');
          }
          console.log('VIDEO_STATIC_PASS '+JSON.stringify({changed:changed.length,protected:true,mode}));
          fs.mkdirSync('video-qa/screenshots',{recursive:true});
          const rows=[];
          async function check(b,entry,width){
           const row={file:entry.file,width,errors:[],yt:0,ig:0,links:0,hidden:[]};const ctx=await b.newContext({viewport:{width,height:width===1440?900:844},deviceScaleFactor:1,reducedMotion:'reduce'});
           try{
           await ctx.route('**/*',async route=>{const u=new URL(route.request().url());if(u.protocol==='data:'||u.protocol==='blob:')return route.continue();if(u.origin!==root.slice(0,-1)||route.request().method()!=='GET')return route.abort('blockedbyclient');if(mode==='live')return route.continue();let pp=path.resolve(dir,'.'+decodeURIComponent(u.pathname));if(pp!==dir&&!pp.startsWith(dir+path.sep))return route.abort();try{if(fs.statSync(pp).isDirectory())pp=path.join(pp,'index.html');return route.fulfill({path:pp})}catch{return route.fulfill({status:404,body:'missing'})}});
           const p=await ctx.newPage();p.setDefaultTimeout(10000);p.on('pageerror',e=>row.errors.push('JS '+e.message));
           const url=root+entry.file.replace(/index\.html$/,'');let res;for(let t=0;t<(mode==='live'?6:1);t++){res=await p.goto(url,{waitUntil:'domcontentloaded',timeout:30000});if(res.status()===200&&norm(await res.text())===norm(get(entry.file)))break;await p.waitForTimeout(2500)}
           assert(res.status()===200&&norm(await res.text())===norm(get(entry.file)),'HTML source mismatch');
           const media=await p.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth,yt:[...document.querySelectorAll('iframe[src*="youtube.com/embed/"],iframe[src*="youtube-nocookie.com/embed/"]')].map(e=>({id:e.getAttribute('src').split('/embed/')[1].split('?')[0],w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height,closed:!!e.closest('details:not([open])'),title:e.getAttribute('title')})),ig:[...document.querySelectorAll('blockquote.instagram-media')].map(e=>e.getAttribute('data-instgrm-permalink').match(/\/(?:p|reel|tv)\/([^/?]+)/)?.[1]),links:[...document.querySelectorAll('a[href*="youtube.com/shorts/"],a[href*="youtube.com/watch"],a[href*="instagram.com/p/"],a[href*="instagram.com/reel/"]')].map(e=>({href:e.getAttribute('href'),visible:e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0,closed:!!e.closest('details:not([open])')}))}));
           assert(media.width===width&&media.scroll<=width+1,'horizontal overflow '+media.scroll);assert(same(media.yt.map(x=>x.id).sort(),[...entry.yt].sort()),'YouTube IDs mismatch');assert(same(media.ig.sort(),[...entry.ig].sort()),'Instagram IDs mismatch');
           for(const id of entry.yt){const f=media.yt.find(x=>x.id===id);assert(f.title&&f.w>0&&f.h>0&&!f.closed,'hidden iframe '+id+' '+JSON.stringify(f));assert(f.w>=140&&f.h>=160,'tiny video '+id);row.yt++;if(id!=='OjCx-B5GCvU'||entry.file==='washing-machine-cleaning/index.html'){assert(media.links.some(x=>x.href.includes(id)&&x.visible&&!x.closed),'video fallback missing '+id);row.links++}}
           for(const id of entry.ig){assert(media.links.some(x=>x.href.includes(id)&&x.visible&&!x.closed),'Instagram fallback missing '+id);row.ig++;row.links++}
           if(entry.home){const v=await p.evaluate(()=>{let y=s=>document.querySelector(s).getBoundingClientRect().top+scrollY;return{proof:y('main > .commitment'),video:y('#premium-video'),review:y('main > .review-ext'),price:y('#pricing')}});assert(v.proof<v.video&&v.video<v.review&&v.review<v.price,'video sequence');row.order=v}
           if(entry.section){const loc=p.locator(entry.section);assert(await loc.count()===1&&await loc.isVisible(),'section missing');await loc.evaluate(e=>e.scrollIntoView({block:'start',behavior:'instant'}));await p.screenshot({path:'video-qa/screenshots/'+entry.file.replace(/[\/.]/g,'-')+'-'+width+'.png',animations:'disabled'});}
           assert(!row.errors.length,row.errors.join(';'));row.pass=true;
           }catch(e){row.errors.push(e.message.slice(0,600));row.pass=false;}finally{await ctx.close()}rows.push(row);console.log('VIDEO_CASE '+JSON.stringify(row));
          }
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});try{const tasks=pages.flatMap(e=>[1440,390,320].map(w=>[e,w]));let n=0;await Promise.all(Array.from({length:5},async()=>{while(n<tasks.length){const [e,w]=tasks[n++];await check(b,e,w)}}))}finally{await b.close()}const summary={mode,cases:rows.length,pass:rows.filter(r=>r.pass).length,yt:rows.reduce((n,r)=>n+r.yt,0),ig:rows.reduce((n,r)=>n+r.ig,0),links:rows.reduce((n,r)=>n+r.links,0),failed:rows.filter(r=>!r.pass)};fs.writeFileSync('video-qa/results.json',JSON.stringify({summary,rows},null,2));console.log('VIDEO_SUMMARY '+JSON.stringify(summary));if(summary.failed.length)process.exitCode=1})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check qa-video.cjs
          node qa-video.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bc-work-video-layout-qa
          path: video-qa/
          retention-days: 7
          if-no-files-found: warn
