name: BC home LP value draft QA 20261127
on:
  push:
    branches: [qa/quality-guarantee-live-20261127]
    paths: [.github/workflows/quality-guarantee-live-20261127.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify draft guarantee manifest without deployment
        run: |
          git worktree add --detach "$RUNNER_TEMP/home-value" b89dca52aa8ec9097db623475d95350cf2acc41d
          cd "$RUNNER_TEMP/home-value"
          python .github/scripts/render_quality_guarantee.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install existing browser QA dependency and Japanese font
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Browser QA on draft content (no external sends)
        env:
          DRAFT_DIR: ${{ runner.temp }}/home-value
        run: |
          cat > qa-home-value.cjs <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path'),cp=require('child_process');
          const root='https://teruya1229.github.io/',dir=process.env.DRAFT_DIR,out='qa-home-value-preview';
          const base='38b8ce8eafbca7df07013bf7b92317f0d12d7635',head='b89dca52aa8ec9097db623475d95350cf2acc41d';
          const files=['cursor-test/index.html','complete-disassembly/index.html'];
          const assert=(v,m)=>{if(!v)throw Error(m)};
          const sortTags=(s,r)=>Array.from(s.matchAll(r),m=>m[0]).sort();
          const eq=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
          const norm=s=>s.replace(/\r\n/g,'\n').trim();
          const src=f=>fs.readFileSync(path.join(dir,f),'utf8'),old=f=>cp.execFileSync('git',['show',base+':'+f],{encoding:'utf8',maxBuffer:8*1024*1024});
          fs.mkdirSync(out,{recursive:true});
          assert(eq(cp.execFileSync('git',['diff','--name-only',base,head],{encoding:'utf8'}).trim().split('\n').sort(),[...files].sort()),'changed paths');
          for(const f of files){const a=old(f),b=src(f);for(const re of [/<img\b[^>]*>/gi,/<script\b[\s\S]*?<\/script>/gi,/<!-- BCQ:(?:CSS|HERO|DETAIL):BEGIN -->[\s\S]*?<!-- BCQ:(?:CSS|HERO|DETAIL):END -->/g,/<a\b[^>]*href=["'](?:https?:\/\/(?:lin\.ee|line\.me|airrsv\.net)|tel:)[^"']*["'][^>]*>[\s\S]*?<\/a>/gi,/<details\b[^>]*>[\s\S]*?<\/details>/gi])assert(eq(sortTags(a,re),sortTags(b,re)),f+' protected '+re);assert(!b.includes('13件'),'stale review count');}
          console.log('HOME_STATIC '+JSON.stringify({files,protected:true}));
          const rows=[];
          async function run(browser,file,width){
           const row={file,width,errors:[],faq:0,cta:[],images:null}; const ctx=await browser.newContext({viewport:{width,height:width===1440?900:width===390?844:568},deviceScaleFactor:1,reducedMotion:'reduce'});
           try{
           await ctx.route('**/*',async route=>{const u=new URL(route.request().url());if(u.origin!=='https://teruya1229.github.io'||route.request().method()!=='GET')return route.abort('blockedbyclient');let pp=path.resolve(dir,'.'+decodeURIComponent(u.pathname));if(pp!==dir&&!pp.startsWith(dir+path.sep))return route.abort();try{if(fs.statSync(pp).isDirectory())pp=path.join(pp,'index.html');if(!fs.statSync(pp).isFile())return route.fulfill({status:404,body:'missing'});return route.fulfill({path:pp})}catch{return route.fulfill({status:404,body:'missing'})}});
           await ctx.addInitScript(()=>{window.__qaClicks=[];document.addEventListener('click',e=>{const a=e.target.closest?.('a');if(a&&/^(https?:\/\/(?:lin\.ee\/|line\.me\/|airrsv\.net\/)|tel:)/i.test(a.getAttribute('href')||'')){window.__qaClicks.push({href:a.getAttribute('href'),trusted:e.isTrusted});e.preventDefault()}},true)});
           const p=await ctx.newPage();p.setDefaultTimeout(10000);p.on('pageerror',e=>row.errors.push('JS '+e.message));
           const res=await p.goto(root+file.replace(/index\.html$/,''),{waitUntil:'domcontentloaded',timeout:30000});assert(res.status()===200&&norm(await res.text())===norm(src(file)),'source mismatch');
           await p.evaluate(async()=>{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);scrollTo(0,0)});
           const home=file.startsWith('cursor-test'),key=(home?'home':'complete')+'-'+width;
           const layout=await p.evaluate(home=>{const y=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {y:r.top+scrollY,bottom:r.bottom+scrollY,left:r.left,right:r.right,visible:r.width>0&&r.height>0}};return {width:innerWidth,scroll:document.documentElement.scrollWidth,h1:y('main h1'),brief:y('.bcq-brief'),detail:y('.bcq-detail'),faq:y('#faq'),hero:y('.hero'),line:y('main a[data-cta="line"],main a[href^="https://lin.ee/"]'),reasons:home?y('main > .reasons'):null,proof:home?y('main > .commitment'):null,review:home?y('main > .review-ext'):null,pricing:home?y('#pricing'):null,priceCta:home?y('#primary-cta'):null};},home);
           row.layout=layout;
           assert(layout.width===width&&layout.scroll<=width+1,'horizontal overflow');
           assert(layout.h1?.visible&&layout.brief?.visible&&layout.h1.y<layout.brief.y,'header/guarantee order');
           assert(layout.line?.visible,'CTA missing');
           if(home){const z=layout;assert(z.hero.bottom<=z.reasons.y+2&&z.reasons.y<z.proof.y&&z.proof.y<z.review.y&&z.review.y<z.pricing.y&&z.pricing.y<z.priceCta.y&&z.detail.y<z.faq.y,'section order');}
           await p.screenshot({path:out+'/'+key+'-hero.png',animations:'disabled'});
           if(home){for(const [name,sel] of [['reasons','main > .reasons'],['proof','main > .commitment'],['review','main > .review-ext'],['price','main > #pricing']]){await p.locator(sel).scrollIntoViewIfNeeded();await p.screenshot({path:out+'/'+key+'-'+name+'.png',animations:'disabled'});}}
           row.images=await p.evaluate(async()=>{const es=[...document.images].filter(i=>{const s=i.getAttribute('src');if(!s)return false;try{return new URL(i.currentSrc||i.src,location.href).origin===location.origin}catch{return false}});es.forEach(i=>i.loading='eager');await Promise.race([Promise.all(es.map(i=>i.decode().catch(()=>{}))),new Promise(r=>setTimeout(r,12000))]);return{count:es.length,ok:es.filter(i=>i.naturalWidth>0).length,bad:es.filter(i=>!i.naturalWidth).map(i=>i.getAttribute('src'))}});assert(!row.images.bad.length,'image decode '+JSON.stringify(row.images.bad));
           const faqs=p.locator('#faq details,.faq details,.faq-list details,details.faq-details');for(let i=0;i<await faqs.count();i++){const d=faqs.nth(i),s=d.locator(':scope>summary');if(!await s.count()||!await s.isVisible())continue;const was=await d.evaluate(e=>e.open);await s.evaluate(e=>e.scrollIntoView({block:'center',behavior:'instant'}));await s.click();assert(await d.evaluate(e=>e.open)!==was,'FAQ open '+i);await s.evaluate(e=>e.scrollIntoView({block:'center',behavior:'instant'}));await s.click();assert(await d.evaluate(e=>e.open)===was,'FAQ close '+i);row.faq++;}
           assert(row.faq>0,'FAQ missing');
           if(width===390){const events=()=>p.evaluate(()=>[...(window.dataLayer||[])].filter(x=>x[0]==='event').map(x=>x[1]));for(const [type,sel] of [['line','a[href^="https://lin.ee/"]'],['tel','a[href^="tel:"]'],['reserve','a[href^="https://airrsv.net/"]']]){const loc=p.locator(sel);let a;for(let i=0;i<await loc.count();i++){if(await loc.nth(i).isVisible()){a=loc.nth(i);break}}if(!a)continue;const n=(await events()).length,k=await p.evaluate(()=>window.__qaClicks.length);await a.evaluate(e=>e.scrollIntoView({block:'center',behavior:'instant'}));await a.click();let cs=await p.evaluate(()=>window.__qaClicks),ev=(await events()).slice(n);assert(cs.length>k&&cs.at(-1).trusted,'CTA '+type);assert(ev.length,'CTA event '+type);row.cta.push({type,events:ev});}
           if(!home){const link=p.locator('a.cd-proof-photo-link').first(),dialog=p.locator('#cd-photo-dialog');await link.evaluate(e=>e.scrollIntoView({block:'center',behavior:'instant'}));await link.click();await dialog.waitFor({state:'visible'});assert(await dialog.locator('img').evaluate(async i=>{await i.decode();return i.naturalWidth>0}),'photo dialog decode');await dialog.locator('button').click();assert(await dialog.evaluate(e=>!e.open),'photo dialog close');row.photoDialog=true;}
           const a=p.locator('a.bcq-link[href^="/quality-guarantee/"]').first();await a.evaluate(e=>e.scrollIntoView({block:'center',behavior:'instant'}));await a.click();await p.waitForURL('**/quality-guarantee/**');assert(await p.locator(new URL(p.url()).hash).count()===1,'policy anchor');row.policy=true;}
           assert(!row.errors.length,row.errors.join(';'));row.pass=true;
           }catch(e){row.errors.push(e.message.slice(0,500));row.pass=false;}finally{await ctx.close()}rows.push(row);console.log('HOME_CASE '+JSON.stringify(row));
          }
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});try{await Promise.all(files.flatMap(f=>[1440,390,320].map(w=>run(b,f,w))))}finally{await b.close()}const summary={cases:rows.length,pass:rows.filter(x=>x.pass).length,faq:rows.reduce((n,x)=>n+x.faq,0),cta:rows.reduce((n,x)=>n+x.cta.length,0),images:rows.reduce((n,x)=>n+(x.images?.count||0),0),imageOK:rows.reduce((n,x)=>n+(x.images?.ok||0),0),failed:rows.filter(x=>!x.pass)};fs.writeFileSync(out+'/result.json',JSON.stringify({base,head,summary,rows},null,2));console.log('HOME_SUMMARY '+JSON.stringify(summary));if(summary.failed.length)process.exitCode=1;})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node --check qa-home-value.cjs
          node qa-home-value.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bc-home-value-preview-20261127
          path: qa-home-value-preview/
          retention-days: 7
          if-no-files-found: warn
