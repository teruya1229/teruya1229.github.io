name: BC quality FAQ draft preview 20261127
on:
  push:
    branches: [qa/quality-guarantee-live-20261127]
    paths: [.github/workflows/quality-guarantee-live-20261127.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify draft manifest without deploying
        run: |
          git worktree add --detach "$RUNNER_TEMP/faq-draft" 6d4dd42773f2cea3c7fc9b9b12aadca51cbceb7f
          cd "$RUNNER_TEMP/faq-draft"
          python .github/scripts/render_quality_guarantee.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser QA dependency and Japanese font
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Review draft static files and browser interactions
        env:
          DRAFT_DIR: ${{ runner.temp }}/faq-draft
        run: |
          node qa/quality-faq-preview-20261127.cjs
          git diff 7f53e0b68ce3ef7a063c79c0fa13bef18bb1b007 6d4dd42773f2cea3c7fc9b9b12aadca51cbceb7f > qa-quality-faq-preview/proposed.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bc-quality-faq-preview-20261127
          path: qa-quality-faq-preview/
          if-no-files-found: warn
          retention-days: 7
