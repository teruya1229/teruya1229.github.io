name: BC LP public crosslinks final Chrome 20261119
on:
  push:
    branches: [qa/site-crosslinks-live-20261119]
    paths: [.github/workflows/site-crosslinks-live-20261119.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Japanese Noto and Chrome
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Real public page QA 3x3 plus actual link clicks, 24 LP endpoints
        run: node qa/site-crosslinks-live-20261119.cjs
      - name: Save full page screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: site-crosslinks-live-20261119, path: qa-crosslink-live-20261119/, if-no-files-found: warn}
