name: South hub before after Japanese Chrome QA 20261119
on:
  push:
    branches: [improve/south-trust-hub-20261119]
    paths: [.github/workflows/south-review-20261119.yml, cursor-test/south.html]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Japanese font and Chrome setup
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Compare current main and south page proposal
        run: node qa/south-preview-20261119.cjs
      - name: Save full-page screenshots before after
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: south-preview-20261119, path: qa-south-preview-20261119/, if-no-files-found: warn}
