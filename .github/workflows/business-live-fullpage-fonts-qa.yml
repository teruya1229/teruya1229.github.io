name: Business LP production full-page visual QA
on:
  push:
    branches:
      - qa/business-live-fullpage-fonts-20261119
    paths:
      - .github/workflows/business-live-fullpage-fonts-qa.yml

permissions:
  contents: read

jobs:
  capture-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese fonts and test browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          fc-match -s ':lang=ja' family | head -6
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          google-chrome --version
      - name: Capture actual production page without external analytics calls
        shell: bash
        run: |
          mkdir -p /tmp/bc-business-visual
          node <<'JS'
          const fs=require('fs');
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const results=[];
            const root='https://teruya1229.github.io/business-cleaning/';
            try {
              for (const width of [1440,390,320]) {
                const context=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
                const page=await context.newPage();
                const failures=[];
                page.on('pageerror',e=>failures.push('JS: '+e.message));
                await page.route('**/*', route=>{
                  const u=route.request().url();
                  if (u.startsWith('https://teruya1229.github.io/') || u.startsWith('data:') || u.startsWith('blob:')) return route.continue();
                  return route.abort('blockedbyclient');
                });
                const r=await page.goto(root,{waitUntil:'domcontentloaded',timeout:45000});
                await page.locator('img').evaluateAll(imgs=>imgs.forEach(img=>{img.loading='eager';img.decoding='sync'}));
                await page.evaluate(async()=>{
                  await Promise.all(Array.from(document.images, img=>img.decode().catch(()=>{})));
                });
                await page.evaluate(async()=>{
                  for(let y=0;y<document.documentElement.scrollHeight;y+=600){
                    scrollTo(0,y);
                    await new Promise(resolve=>setTimeout(resolve,30));
                  }
                  scrollTo(0,0);
                });
                await page.waitForTimeout(850);
                const metrics=await page.evaluate(()=>({
                  text:document.querySelector('h1')?.innerText,
                  scrollWidth:document.documentElement.scrollWidth,
                  viewport:innerWidth,
                  documentHeight:document.documentElement.scrollHeight,
                  estimateHeading:[...document.querySelectorAll('h2')].map(e=>e.innerText).find(s=>s.includes('清掃会社を変える前に')),
                  images:[...document.images].map(i=>({src:i.getAttribute('src'),loaded:i.complete && i.naturalWidth>0})),
                  faq:document.querySelectorAll('details').length,
                  lineLinks:document.querySelectorAll('a[href*="lin.ee"]').length,
                  reviews:document.querySelectorAll('a[href*="/review/"]').length,
                  japaneseFont:document.fonts.check('16px "Noto Sans CJK JP"','日本語を確認')
                }));
                await page.screenshot({path:'/tmp/bc-business-visual/live-'+width+'-full.png',fullPage:true,animations:'disabled',timeout:60000});
                results.push({width,status:r.status(),...metrics,failures});
                await context.close();
              }
              fs.writeFileSync('/tmp/bc-business-visual/results.json',JSON.stringify(results,null,2));
              console.log(JSON.stringify(results,null,2));
              if(results.some(x=>x.status!==200 || x.scrollWidth>x.viewport || x.images.some(i=>!i.loaded) || x.failures.length || !x.estimateHeading || !x.japaneseFont)){
                process.exitCode=1;
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-live-fullpage-fonts-20261119
          path: /tmp/bc-business-visual/
          if-no-files-found: error
