name: Washer diagnosis Chrome QA fallback (isolated Linux)
on:
  push:
    branches:
      - feature/washer-three-question-diagnosis-20261108
      - fix/washer-mobile-line-diagnosis-20261115
    paths:
      - .github/workflows/washer-diagnosis-linux-qa.yml
      - washing-machine-cleaning/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium for UI QA
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser tests (no analytics network)
        run: node washing-machine-cleaning/tests/diagnosis-browser-qa.cjs
      - name: Verify LIVE GitHub Pages assets and mobile CTA (no LINE navigation)
        run: |
          node <<'NODE'
          'use strict';
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const {chromium}=require('playwright');
          const origin='https://teruya1229.github.io';
          const home=origin+'/washing-machine-cleaning/';
          const base='https://line.me/R/oaMessage/%40657tpifw/?';
          (async()=>{
            const targets=[
              [home,'washing.js?v=20261115a'],
              [home+'assets/washing.js?v=20261115a','LINE_CHAT_BASE'],
              [home+'assets/diagnosis.js?v=20261115a','Count only successfully completed'],
              [home+'assets/washing.css?v=20261115a','.hero__scope{order:4;']
            ];
            for(const [url,needle] of targets){
              const res=await fetch(url,{headers:{'Cache-Control':'no-cache'}});
              assert.equal(res.status,200,'bad live response '+url+' '+res.status);
              const content=await res.text();
              assert(content.includes(needle),'stale live asset '+url);
            }
            const browser=await chromium.launch({headless:true});
            let checked=0;
            try{
              for(const [width,ua,mobile] of [
                [390,'Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4 Mobile/15E148 Safari/604.1',true],
                [360,'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36',true],
                [1440,'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',false]
              ]){
                const ctx=await browser.newContext({viewport:{width,height:850},userAgent:ua,reducedMotion:'reduce'});
                await ctx.route('**/*',route=>route.request().url().startsWith(origin+'/')?route.continue():route.abort());
                const page=await ctx.newPage(),errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const res=await page.goto(home+'?utm_source=ig&utm_medium=paid_social',{waitUntil:'domcontentloaded',timeout:30000});
                assert.equal(res.status(),200);
                if(mobile){
                  const h=await page.evaluate(()=>({
                    title:document.querySelector('.hero h1').getBoundingClientRect().top,
                    prices:document.querySelector('.hero__prices').getBoundingClientRect().top,
                    scope:document.querySelector('.hero__scope').getBoundingClientRect().top,
                    info:document.querySelector('.micro-note').getBoundingClientRect().top
                  }));
                  assert(h.title<h.prices && h.prices<h.scope && h.scope<h.info,'live hero order '+width);
                }
                await page.evaluate(()=>document.addEventListener('click',e=>{
                  if(e.target.closest('a[data-cta-location]'))e.preventDefault();
                }));
                const hero=page.locator('a[data-cta-location="hero"]');
                await hero.click();
                const href=await hero.getAttribute('href');
                if(mobile){
                  assert(href.startsWith(base),'live mobile LINE chat link '+width);
                  assert.equal(await hero.getAttribute('target'),null,'unexpected popup '+width);
                  assert(decodeURIComponent(href.slice(base.length)).includes('【洗濯機LPからのご相談】'));
                  await page.locator('input[name="washer_type"][value="drum"]').check();
                  await page.locator('[name="usage_age"]').selectOption('5to6');
                  await page.locator('[name="symptom"]').selectOption('drying');
                  await page.locator('.washer-diagnosis__submit').click();
                  const diag=page.locator('a[data-cta-location="diagnosis_result"]');
                  await diag.click();
                  assert(decodeURIComponent((await diag.getAttribute('href')).slice(base.length)).includes('5〜6年'));
                }else assert.equal(href,'https://lin.ee/tsilra6');
                assert.equal(errors.length,0,'live JS error '+width+': '+errors.join(';'));
                checked++;
                await ctx.close();
              }
            }finally{await browser.close();}
            const output={status:'PASS',liveHttpAssets:targets.length,viewports:checked,externalNavigation:0,ga4Network:0,deploy:'main'};
            const dir=path.join(process.env.RUNNER_TEMP||process.cwd(),'washer-diagnosis-qa');
            fs.mkdirSync(dir,{recursive:true});
            fs.writeFileSync(path.join(dir,'live-proof.json'),JSON.stringify(output,null,2));
            console.log('WASHER_LIVE_PAGES_QA '+JSON.stringify(output));
          })().catch(e=>{console.error('WASHER_LIVE_PAGES_QA FAIL '+(e.stack||e));process.exitCode=1});
          NODE
      - name: Screenshot and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: washer-diagnosis-chromium-qa
          path: ${{ runner.temp }}/washer-diagnosis-qa/
          if-no-files-found: warn
