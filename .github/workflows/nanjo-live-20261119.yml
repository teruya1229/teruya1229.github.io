name: Nanjo LP postdeploy Chrome live QA 20261119
on:
  push:
    branches: [qa/nanjo-live-20261119]
    paths: [.github/workflows/nanjo-live-20261119.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare Japanese font and Chrome testing
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Inspect public Nanjo page at all widths
        env: {REGION: nanjo}
        run: node qa/regional-chrome-live-20261119.cjs
      - name: Save real screen images
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: nanjo-live-20261119, path: qa-regional-live-nanjo/, if-no-files-found: warn}
