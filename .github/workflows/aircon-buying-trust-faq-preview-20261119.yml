name: Aircon replacement FAQ and identity preview QA
on:
  push:
    branches: [improve/aircon-replacement-trust-faq-20261119]
    paths:
      - mi-bcs/aircon-replacement/index.html
      - .github/workflows/aircon-buying-trust-faq-preview-20261119.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated Japanese font and browser
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Serve branch for preview
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/buying-preview.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/mi-bcs/aircon-replacement/
      - name: Compare live and branch at 1440, 390 and 320
        run: |
          mkdir -p /tmp/buying-faq-preview
          node <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          const pageData=()=>({
            width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
            height:document.documentElement.scrollHeight,
            images:[...document.images].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0})),
            anchors:[...document.querySelectorAll('a[href]')].map(a=>a.getAttribute('href')),
            faqText:[...document.querySelectorAll('#faq .faq-item')].map(el=>({
              q:(el.querySelector('h3,summary')?.textContent||'').trim(),
              a:(el.querySelector('p')?.textContent||'').trim()
            })),
            faqDetails:document.querySelectorAll('#faq details.faq-item').length,
            prices:(document.body.textContent.match(/[\d,]+円/g)||[]),
            scripts:document.querySelectorAll('script').length,
            seller:document.querySelector('#company .overview-table')?.innerText,
            schema:[...document.querySelectorAll('script[type="application/ld+json"]')].map(x=>x.textContent),
            font:document.fonts.check('16px "Noto Sans CJK JP"','確認'),
            outside:[...document.querySelectorAll('h1,h2,h3,p,a,button,summary')].filter(e=>e.getClientRects().length).map(e=>({s:(e.innerText||'').slice(0,30),r:e.getBoundingClientRect()})).filter(x=>x.r.width>0&&(x.r.left<-3||x.r.right>innerWidth+3)).slice(0,8)
          });
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true}),report=[];
            try{
              for(const width of [1440,390,320]){
                for(const kind of ['live','preview']){
                  const ctx=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
                  const page=await ctx.newPage(),errors=[],bad=[];
                  page.on('pageerror',e=>errors.push(e.message));
                  page.on('response',r=>{if((r.url().startsWith('https://teruya1229.github.io/')||r.url().startsWith('http://127.0.0.1:8765/'))&&r.status()>=400)bad.push(r.status()+' '+r.url())});
                  await page.route('**/*',r=>{const u=r.request().url();return u.startsWith('https://teruya1229.github.io/')||u.startsWith('http://127.0.0.1:8765/')||u.startsWith('data:')?r.continue():r.abort('blockedbyclient')});
                  const u=kind==='live'?'https://teruya1229.github.io/mi-bcs/aircon-replacement/':'http://127.0.0.1:8765/mi-bcs/aircon-replacement/';
                  const r=await page.goto(u,{waitUntil:'domcontentloaded',timeout:45000});
                  await page.locator('img').evaluateAll(imgs=>imgs.forEach(i=>i.loading='eager'));
                  await page.evaluate(async()=>{await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));for(let y=0;y<document.documentElement.scrollHeight;y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,13))};scrollTo(0,0)});
                  await page.waitForTimeout(320);
                  const metrics=await page.evaluate(pageData);
                  await page.screenshot({path:'/tmp/buying-faq-preview/'+kind+'-'+width+'-full.png',fullPage:true,animations:'disabled',timeout:60000});
                  if(kind==='preview'){
                    const faqs=page.locator('#faq details.faq-item');
                    for(let i=0;i<await faqs.count();i++){
                      const f=faqs.nth(i);
                      if(await f.evaluate(e=>e.open))errors.push('FAQ_INIT_OPEN '+i);
                      await f.locator('summary').click();
                      if(!await f.evaluate(e=>e.open))errors.push('FAQ_CANNOT_OPEN '+i);
                      await f.locator('summary').click();
                      if(await f.evaluate(e=>e.open))errors.push('FAQ_CANNOT_CLOSE '+i);
                    }
                    await page.locator('#ae-size').selectOption('14');
                    await page.locator('#ae-stairs').selectOption('3');
                    if(!((await page.locator('#ae-total').innerText()).includes('152,000円')))errors.push('COST_SCENARIO');
                    await page.locator('#ae-stairs').selectOption('6plus');
                    if(!((await page.locator('#ae-extra').innerText()).includes('要見積もり')))errors.push('SIXTH_FLOOR');
                  }
                  report.push({width,kind,http:r.status(),...metrics,errors,bad});
                  await ctx.close();
                }
              }
              for(const width of [1440,390,320]){
                const before=report.find(x=>x.width===width&&x.kind==='live');
                const after=report.find(x=>x.width===width&&x.kind==='preview');
                const keys=['anchors','faqText','prices','scripts'];
                for(const key of keys){if(JSON.stringify(before[key])!==JSON.stringify(after[key]))after.errors.push('REGRESSION_'+key.toUpperCase())}
                if(after.faqDetails!==16)after.errors.push('FAQ_COUNT');
                if(after.height>=before.height-(width>=1024?600:1600))after.errors.push('FAQ_NOT_COMPACT_ENOUGH');
                if(!after.seller?.includes('販売・施工の役割')||!after.seller?.includes('相談・施工窓口：BCサービス'))after.errors.push('SELLER_ROLE');
                if(!JSON.parse(after.schema[0]).alternateName?.every(x=>x!=='BCサービス'))after.errors.push('SCHEMA_BRAND');
              }
              fs.writeFileSync('/tmp/buying-faq-preview/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report.map(x=>({width:x.width,kind:x.kind,http:x.http,height:x.height,faqDetails:x.faqDetails,prices:x.prices.length,anchors:x.anchors.length,errors:x.errors,bad:x.bad,outside:x.outside,images:x.images})),null,2));
              if(report.some(x=>x.http!==200||x.scrollWidth>x.width||x.images.some(i=>!i.loaded)||x.errors.length||x.bad.length||x.outside.length||!x.font))process.exitCode=1;
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aircon-buying-faq-preview-20261119
          path: /tmp/buying-faq-preview/
          if-no-files-found: warn
