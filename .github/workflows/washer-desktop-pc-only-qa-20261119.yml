name: Washer PC-only editorial design QA
on:
  push:
    branches: [fix/washer-desktop-spacious-layout-20261119]
    paths:
      - 'washing-machine-cleaning/**'
      - '.github/workflows/washer-desktop-pc-only-qa-20261119.yml'
permissions:
  contents: read
jobs:
  verify-desktop-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use existing Google Chrome
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          google-chrome --version
      - name: Preserve all 80 diagnosis cases
        run: node washing-machine-cleaning/tests/diagnosis-browser-qa.cjs
      - name: Keep previous buying reasons and LINE safety
        run: |
          sed -i "s/chromium.launch({headless:true})/chromium.launch({headless:true,channel:'chrome'})/g" washing-machine-cleaning/tests/washer-buying-reasons-qa-20261118.cjs
          node washing-machine-cleaning/tests/washer-buying-reasons-qa-20261118.cjs
      - name: Preserve approved prices and drum conditions
        run: |
          sed -i "s/chromium.launch({headless:true})/chromium.launch({headless:true,channel:'chrome'})/g" washing-machine-cleaning/tests/washer-price-value-qa-20261118.cjs
          node washing-machine-cleaning/tests/washer-price-value-qa-20261118.cjs
      - name: Compare production vs desktop branch in eight Chrome widths
        run: node washing-machine-cleaning/tests/washer-desktop-pc-only-qa-20261119.cjs
      - name: Upload 13-section screenshots and geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: washer-desktop-pc-only-before-after
          path: /tmp/washer-desktop-polish-qa/
          if-no-files-found: warn
