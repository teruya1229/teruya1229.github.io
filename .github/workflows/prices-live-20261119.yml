name: Prices LP postdeploy live Chrome QA 20261119
on:
  push:
    branches: [qa/prices-live-20261119]
    paths: [.github/workflows/prices-live-20261119.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Japanese QA font and Chrome test
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Inspect published prices in Chrome
        run: node qa/prices-live-20261119.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: prices-live-20261119, path: qa-prices-live/, if-no-files-found: warn}
