name: Washer full-page design consistency QA
on:
  push:
    branches: [fix/washer-fullpage-design-audit-20261119]
    paths:
      - 'washing-machine-cleaning/**'
      - '.github/workflows/washer-fullpage-design-qa-20261119.yml'
permissions:
  contents: read
jobs:
  fullpage-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use installed Google Chrome
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          google-chrome --version
      - name: Preserve all 80 diagnosis cases and existing GA4 events
        run: node washing-machine-cleaning/tests/diagnosis-browser-qa.cjs
      - name: Validate symptom-linked photos and review / LINE paths
        run: |
          sed -i "s/chromium.launch({headless:true})/chromium.launch({headless:true,channel:'chrome'})/g" washing-machine-cleaning/tests/washer-buying-reasons-qa-20261118.cjs
          node washing-machine-cleaning/tests/washer-buying-reasons-qa-20261118.cjs
      - name: Validate tariffs and drum conditions
        run: |
          sed -i "s/chromium.launch({headless:true})/chromium.launch({headless:true,channel:'chrome'})/g" washing-machine-cleaning/tests/washer-price-value-qa-20261118.cjs
          node washing-machine-cleaning/tests/washer-price-value-qa-20261118.cjs
      - name: Validate all 13 sections and visual evidence at five widths
        run: node washing-machine-cleaning/tests/washer-fullpage-design-qa-20261119.cjs
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: washer-fullpage-design-qa-20261119
          path: /tmp/washer-fullpage-design-qa/
          if-no-files-found: warn
