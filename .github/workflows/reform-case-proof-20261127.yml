name: Reform case proof isolated preview and live QA
on:
  pull_request:
    branches: [lp/reform-case-proof-20261127]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      QA_MODE: live
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Read Pages deployment status without delaying live proof
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: aebfc22485eff08de2bc65b141eb282feb879591
        shell: bash
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=30" --jq '.workflow_runs[] | [.id,.name,.head_sha,.status,(.conclusion // "")] | @tsv' || true
      - name: Check exact page and image geometry
        shell: bash
        run: |
          mkdir -p /tmp/reform-case-qa
          node <<'JS'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path'),assert=require('assert/strict');
          const root='https://teruya1229.github.io/', dir=process.cwd(),mode=process.env.QA_MODE;
          const exact=fs.readFileSync('reform/index.html','utf8').replace(/\r\n/g,'\n').trim();
          const rows=[];
          async function test(browser,width){
            const ctx=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
            const row={width,mode,errors:[],bad:[]};
            try {
              await ctx.route('**/*',async r=>{
                const u=new URL(r.request().url());
                if(['data:','blob:'].includes(u.protocol))return r.continue();
                if(u.origin!==root.slice(0,-1)||r.request().method()!=='GET')return r.abort('blockedbyclient');
                if(mode==='live')return r.continue();
                let fp=path.resolve(dir,'.'+decodeURIComponent(u.pathname));
                if(fp!==dir&&!fp.startsWith(dir+path.sep))return r.abort();
                try{if(fs.statSync(fp).isDirectory())fp=path.join(fp,'index.html');return r.fulfill({path:fp})}catch{return r.fulfill({status:404,body:'missing'})}
              });
              const p=await ctx.newPage();p.setDefaultTimeout(10000);
              p.on('pageerror',e=>row.errors.push(e.message));
              p.on('response',r=>{if(r.url().startsWith(root)&&r.status()>=400)row.bad.push(r.status()+' '+r.url())});
              let res=await p.goto(root+'reform/',{waitUntil:'domcontentloaded',timeout:30000});
              const css=await p.request.get(root+'reform/assets/css/reform.css');row.cssExact=css.ok()&&(await css.text()).replace(/\r\n/g,'\n').trim()===fs.readFileSync('reform/assets/css/reform.css','utf8').replace(/\r\n/g,'\n').trim();assert(row.cssExact,'CSS source mismatch');row.http=res.status();row.exact=(await res.text()).replace(/\r\n/g,'\n').trim()===exact;assert.equal(row.http,200);assert(row.exact,'source mismatch');
              await p.locator('img').evaluateAll(es=>es.forEach(i=>i.loading='eager'));
              await p.evaluate(async()=>{await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));await document.fonts.ready});
              const proof=p.locator('.reform-case-proof');assert.equal(await proof.count(),1);
              row.photos=await proof.locator('img').evaluateAll(es=>es.map(e=>{const r=e.getBoundingClientRect();return {src:e.getAttribute('src'),w:r.width,h:r.height,nw:e.naturalWidth,nh:e.naturalHeight,fit:getComputedStyle(e).objectFit,x:r.left,y:r.top}}));
              assert.equal(row.photos.length,2);for(const g of row.photos){assert(g.nw===900&&g.nh===1200&&Math.abs(g.w/g.h-.75)<.02&&g.w>=120&&g.x>=0&&g.x+g.w<=width+1,'bad photo '+JSON.stringify(g))}
              assert(Math.abs(row.photos[0].y-row.photos[1].y)<1,'not aligned');
              row.images=await p.locator('img').evaluateAll(es=>es.map(e=>({src:e.getAttribute('src'),ok:e.complete&&e.naturalWidth>0})));
              assert(row.images.every(i=>i.ok),'missing images');
              row.overflow=await p.evaluate(()=>document.documentElement.scrollWidth-innerWidth);assert(row.overflow<=1,'overflow '+row.overflow);
              row.line=await p.locator('a[href*="lin.ee"]').count();row.phone=await p.locator('a[href^="tel:"]').count();assert(row.line>0&&row.phone>0,'missing CTA');
              const faqs=p.locator('#faq details');row.faq=await faqs.count();for(let i=0;i<row.faq;i++){const el=faqs.nth(i),was=await el.evaluate(e=>e.open);await el.locator('summary').click();assert.notEqual(await el.evaluate(e=>e.open),was);await el.locator('summary').click();assert.equal(await el.evaluate(e=>e.open),was);}
              row.reel=await p.locator('.bc-reel-media[data-reel-id="DReZcGyEcBL"]').count();assert.equal(row.reel,1);
              await proof.screenshot({path:'/tmp/reform-case-qa/'+width+'-proof.png',animations:'disabled'});await p.screenshot({path:'/tmp/reform-case-qa/'+width+'-full.png',fullPage:true,animations:'disabled'});
              assert(!row.bad.length,JSON.stringify(row.bad));assert(!row.errors.length,JSON.stringify(row.errors));row.pass=true;
            }catch(e){row.pass=false;row.errors.push(e.message)}finally{await ctx.close()}
            rows.push(row);console.log('REFORM_CASE '+JSON.stringify(row));
          }
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});try{for(const w of [1440,390,320])await test(b,w)}finally{await b.close()}fs.writeFileSync('/tmp/reform-case-qa/report.json',JSON.stringify(rows,null,2));console.log('REFORM_SUMMARY '+JSON.stringify({mode,pass:rows.filter(r=>r.pass).length,total:rows.length}));if(rows.some(r=>!r.pass))process.exitCode=1})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reform-case-qa
          path: /tmp/reform-case-qa/
          retention-days: 7
