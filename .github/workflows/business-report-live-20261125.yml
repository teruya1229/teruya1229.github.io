name: Business free report public Chrome QA
on:
  push:
    branches: [qa/business-free-report-20261125]
    paths: [.github/workflows/business-report-live-20261125.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Japanese font and Chrome
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Public production QA
        run: node qa/business-report-live-20261125.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: business-report-live-20261125, path: qa-business-report/, if-no-files-found: warn}
