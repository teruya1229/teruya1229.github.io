name: Lighting LP human trust branch Chrome QA
on:
  push:
    branches: [improve/lighting-human-trust-20261119]
    paths:
      - lighting/**
      - .github/workflows/lighting-human-qa-20261119.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Serve exact branch preview
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lighting-preview.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/lighting/
      - name: Capture baseline and revised branch on PC and smartphones
        run: |
          mkdir -p /tmp/lighting-qa
          node <<'JS'
          const fs=require('fs'),{chromium}=require('playwright');
          const readPage=()=>({
            width:innerWidth,scrollWidth:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight,
            h1:document.querySelector('h1')?.innerText,
            images:[...document.images].map(i=>({url:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0})),
            line:[...document.querySelectorAll('a[href*="lin.ee"]')].map(a=>a.href),
            telephone:[...document.querySelectorAll('a[href^="tel:"]')].map(a=>a.href),
            faqs:document.querySelectorAll('details').length,
            counts:{scripts:document.querySelectorAll('script').length},
            values:(document.body.innerText.match(/[\d,]+円/g)||[]),
            person:!!document.querySelector('.hero-person-photo'),
            personsName:document.querySelector('.hero-person-caption strong')?.textContent,
            outside:[...document.querySelectorAll('h1,h2,h3,p,a,button,summary')].filter(e=>e.getClientRects().length).map(e=>({s:e.innerText?.slice(0,30),r:e.getBoundingClientRect()})).filter(x=>x.r.width>0&&(x.r.left<-3||x.r.right>innerWidth+3)).slice(0,12),
            fonts:document.fonts.check('16px "Noto Sans CJK JP"','日本語')
          });
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            const report=[];
            try{
              for(const width of [1440,390,320]){
                for(const kind of ['baseline','preview']){
                  const ctx=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
                  const page=await ctx.newPage(),errs=[],bad=[];
                  page.on('pageerror',e=>errs.push(e.message));
                  page.on('response',r=>{if((r.url().startsWith('https://teruya1229.github.io/')||r.url().startsWith('http://127.0.0.1:8765/'))&&r.status()>=400)bad.push(r.status()+' '+r.url())});
                  await page.route('**/*',route=>{const u=route.request().url();return u.startsWith('https://teruya1229.github.io/')||u.startsWith('http://127.0.0.1:8765/')||u.startsWith('data:')?route.continue():route.abort('blockedbyclient')});
                  const url=kind==='baseline'?'https://teruya1229.github.io/lighting/':'http://127.0.0.1:8765/lighting/';
                  const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                  await page.locator('img').evaluateAll(imgs=>imgs.forEach(img=>img.loading='eager'));
                  await page.evaluate(async()=>{await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await new Promise(r=>setTimeout(r,15))};scrollTo(0,0)});
                  await page.waitForTimeout(320);
                  const data=await page.evaluate(readPage);
                  await page.screenshot({path:'/tmp/lighting-qa/'+kind+'-'+width+'-full.png',fullPage:true,animations:'disabled',timeout:60000});
                  const details=page.locator('details');
                  for(let i=0;i<await details.count();i++){const d=details.nth(i),before=await d.evaluate(e=>e.open);await d.locator('summary').click();if((await d.evaluate(e=>e.open))===before)errs.push('FAQ_NO_TOGGLE_'+i);await d.locator('summary').click();if((await d.evaluate(e=>e.open))!==before)errs.push('FAQ_NO_RESTORE_'+i)}
                  report.push({kind,width,http:response.status(),...data,errs,bad});
                  await ctx.close();
                }
              }
              for(const width of [1440,390,320]){
                const old=report.find(x=>x.width===width&&x.kind==='baseline');
                const now=report.find(x=>x.width===width&&x.kind==='preview');
                if(JSON.stringify(old.line)!==JSON.stringify(now.line)||JSON.stringify(old.telephone)!==JSON.stringify(now.telephone)||JSON.stringify(old.values)!==JSON.stringify(now.values)||old.faqs!==now.faqs||old.counts.scripts!==now.counts.scripts)now.errs.push('PROTECTED_CONTENT_CHANGED');
                if(!now.person||now.images.length!==1||!now.personsName?.includes('照屋'))now.errs.push('REP_PHOTO_MISSING');
              }
              fs.writeFileSync('/tmp/lighting-qa/report.json',JSON.stringify(report,null,2));
              console.log(JSON.stringify(report,null,2));
              if(report.some(x=>x.http!==200||x.scrollWidth>x.width||x.images.some(i=>!i.loaded)||x.errs.length||x.bad.length||x.outside.length||x.faqs!==9))process.exitCode=1;
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Preserve visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-human-preview-20261119
          path: /tmp/lighting-qa/
          if-no-files-found: warn
