name: MI.BCS sales LP two-axis preview Chrome QA
on:
  push:
    branches: [improve/mi-bcs-sales-faq-trust-20261119]
    paths:
      - mi-bcs/index.html
      - qa/mi-bcs-20261119.cjs
      - .github/workflows/mi-bcs-20261119.yml
permissions:
  contents: read
jobs:
  windows-chrome-qa:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate old and new at 1440 390 320
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node qa/mi-bcs-20261119.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-bcs-preview-20261119
          path: qa-mi-bcs/
          if-no-files-found: warn
