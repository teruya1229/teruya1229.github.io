name: Complete-disassembly CRO review QA (pre-publish)
on:
  push:
    branches: [feat/cd-lp-cro-review-20261118]
    paths:
      - 'complete-disassembly/**'
      - '.github/workflows/complete-cro-qa-20261118.yml'
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve branch and main baseline locally
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/cd-lp-baseline origin/main
          nohup python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cd-stage-serve.log 2>&1 &
          nohup python3 -m http.server 8766 --bind 127.0.0.1 --directory /tmp/cd-lp-baseline > /tmp/cd-baseline-serve.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/complete-disassembly/
          curl -fsS -o /dev/null http://127.0.0.1:8766/complete-disassembly/
      - name: Verify visual layout, links, sources and GA4 debug wiring
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs');
          const {chromium} = require('playwright');
          const widths=[1440,820,390,320];
          const results=[];
          const failures=[];
          fs.mkdirSync('qa-cro', {recursive:true});
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of widths){
                const context=await browser.newContext({viewport:{width,height:900},reducedMotion:'reduce',deviceScaleFactor:1});
                const page=await context.newPage();
                const errors=[];const badLocal=[];
                page.on('pageerror', e=>errors.push(e.message));
                page.on('response', r=>{if(r.url().startsWith('http://127.0.0.1:8765/') && r.status()>=400)badLocal.push({url:r.url(),status:r.status()})});
                await page.route('**/*',r=>{
                  if(r.request().url().startsWith('http://127.0.0.1:8765/'))return r.continue();
                  return r.abort('blockedbyclient');
                });
                const response=await page.goto('http://127.0.0.1:8765/complete-disassembly/?debug=1',{waitUntil:'domcontentloaded',timeout:30000});
                await page.locator('img').evaluateAll(images=>images.forEach(img=>img.loading='eager'));
                await page.waitForTimeout(800);
                const pictureReport=await page.locator('img').evaluateAll(async images=>{
                  return await Promise.all(images.map(async img=>{
                    try{await img.decode()}catch(e){}
                    return {src:img.getAttribute('src'),ready:img.complete&&img.naturalWidth>0,width:img.naturalWidth,height:img.naturalHeight};
                  }));
                });
                for(const [label,selector] of [['hero','.hero'],['photos','.sec-beforeafter-refresh'],['review','.sec-trust-compact'],['price','.sec-price']]){
                  await page.locator(selector).screenshot({path:'qa-cro/stage-'+width+'-'+label+'.png',timeout:45000});
                }
                const data=await page.evaluate(()=>{
                  const sections=[...document.querySelectorAll('main > section')];
                  const proof=[...document.querySelectorAll('.cd-proof-photo-link')];
                  const photos=[...document.querySelectorAll('.sec-beforeafter-refresh img')];
                  return {
                    title:document.title, sections:sections.length, headings:sections.map(s=>s.querySelector('h1,h2')?.textContent?.replace(/\s+/g,' ').trim()||''),
                    scrollWidth:document.documentElement.scrollWidth, windowWidth:window.innerWidth,
                    heroPrice:!!document.querySelector('.hero .cd-hero-price'),
                    reviewText:document.querySelector('.sec-trust-compact .voice-text')?.textContent?.replace(/\s+/g,' ').trim(),
                    reviewsCount:document.querySelectorAll('.sec-trust-compact .voice-item').length,
                    photoLinks:proof.map(a=>a.getAttribute('href')),
                    photoDisplayWidths:photos.map(i=>Math.round(i.getBoundingClientRect().width)),
                    priceCards:[...document.querySelectorAll('.price-card-amount')].map(x=>x.textContent.trim()),
                    insurance:document.querySelector('.price-insurance-card')?.textContent.includes('最大1億円'),
                    line:document.querySelector('.hero a.line-cta')?.getAttribute('href'),
                    phone:document.querySelector('.header-tel')?.getAttribute('href'),
                    booking:document.querySelector('.hero .air-reserve-subcta')?.getAttribute('href'),
                    faq:document.querySelectorAll('.sec-faq details').length
                  };
                });
                await page.locator('.hero .line-cta').click();
                const events=await page.evaluate(()=>window.dataLayer?.filter(x=>x?.[0]==='event').map(x=>x[1])||[]);
                const row={width,http:response.status(),...data,loaded:pictureReport.length,brokenImages:pictureReport.filter(i=>!i.ready),errors,badLocal,events};
                const issues=[];
                if(row.http!==200)issues.push('HTTP');
                if(row.sections!==15)issues.push('SECTION_COUNT');
                if(row.scrollWidth>row.windowWidth+1)issues.push('HORIZONTAL_OVERFLOW');
                if(!row.heroPrice || row.reviewsCount!==1)issues.push('HERO_OR_REVIEW');
                if(row.headings[1]!=='こんなお悩み、ありませんか？'||!row.headings[2].includes('写真で見る')||!row.headings[3].includes('お客様の声'))issues.push('FLOW_ORDER');
                if(row.brokenImages.length)issues.push('IMAGE_DECODE_OR_MISSING');
                if(row.photoLinks.length!==2||row.photoDisplayWidths.some(w=>w<Math.min(280,width-40)))issues.push('PHOTO_VISIBILITY');
                if(row.priceCards.join('|')!=='14,000円〜|23,000円〜')issues.push('PRICE');
                if(!row.insurance||row.faq!==8)issues.push('INSURANCE_OR_FAQ');
                if(row.line!=='https://lin.ee/tsilra6'||row.phone!=='tel:05017241338'||row.booking!=='https://airrsv.net/bc-servicesokinawa/calendar')issues.push('CONTACT_URL');
                if(!events.includes('cta_click')||!events.includes('line_click'))issues.push('GA4_EVENT_WIRING');
                if(row.errors.length||row.badLocal.length)issues.push('JS_OR_RESOURCE_ERROR');
                results.push({...row,issues});
                if(issues.length)failures.push({width,issues});
                await context.close();

                const baselineContext=await browser.newContext({viewport:{width,height:900},reducedMotion:'reduce',deviceScaleFactor:1});
                const baseline=await baselineContext.newPage();
                await baseline.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:8766/')?r.continue():r.abort('blockedbyclient'));
                await baseline.goto('http://127.0.0.1:8766/complete-disassembly/',{waitUntil:'domcontentloaded',timeout:30000});
                await baseline.locator('img').evaluateAll(images=>images.forEach(img=>img.loading='eager'));
                await baseline.locator('img').evaluateAll(async images=>{await Promise.all(images.map(async img=>{try{await img.decode()}catch(e){}}));});

                for(const [label,selector] of [['hero','.hero'],['photos','.sec-beforeafter-refresh'],['review','.sec-trust-compact'],['price','.sec-price']]){
                  await baseline.locator(selector).screenshot({path:'qa-cro/main-'+width+'-'+label+'.png',timeout:45000});
                }
                await baselineContext.close();
              }
            }finally{
              fs.writeFileSync('qa-cro/report.json',JSON.stringify({branch:'feat/cd-lp-cro-review-20261118',baseline:'origin/main',results,failures},null,2));
              await browser.close();
            }
            console.log('COMPLETE_CRO_QA '+JSON.stringify({status:failures.length?'FAIL':'PASS',results,failures}));
            if(failures.length)process.exit(1);
          })().catch(e=>{console.error('QA_ERROR',e.stack||e);process.exit(1)});
          JS
      - name: Preserve review screenshots and machine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-cro-prepublish-compare
          path: qa-cro/
          if-no-files-found: ignore
