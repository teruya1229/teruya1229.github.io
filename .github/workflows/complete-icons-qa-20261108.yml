name: Complete-disassembly 12-icons visual QA
on:
  push:
    branches: [feat/complete-disassembly-icons-20261108]
    paths:
      - 'complete-disassembly/**'
      - '.github/workflows/complete-icons-qa-20261108.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve site and verify supplied icons across four widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cd-qa-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const expected=[
              '01-step-line.webp','02-step-quote.webp','03-step-visit.webp',
              '04-feature-drainpan-fan.webp','05-feature-deep-dirt.webp','06-feature-circuit.webp',
              '07-reason-deep.webp','08-reason-odor.webp','09-reason-clean.webp',
              '10-assurance-insurance.webp','11-assurance-check.webp','12-assurance-repair.webp'
            ];
            const b=await chromium.launch({headless:true});
            const results=[];
            try{
              for(const width of [1440,820,390,320]){
                const context=await b.newContext({viewport:{width,height:900},reducedMotion:'reduce'});
                const page=await context.newPage();
                await page.route('**/*',r=>{
                  const u=r.request().url();
                  if(u.startsWith('http://127.0.0.1:8765/'))return r.continue();
                  return r.abort('blockedbyclient');
                });
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const response=await page.goto('http://127.0.0.1:8765/complete-disassembly/',{waitUntil:'domcontentloaded',timeout:30000});
                await page.locator('.sec-price .cd-assurance-icon').last().scrollIntoViewIfNeeded();
                await page.waitForTimeout(1000);
                const data=await page.evaluate(async()=>{
                  const icons=Array.from(document.querySelectorAll('img[src*="/assets/icons/"]'));
                  for(const i of icons){await i.decode();}
                  const rects=icons.map(x=>({src:x.getAttribute('src'),loaded:x.complete && x.naturalWidth===192 && x.naturalHeight===192,width:Math.round(x.getBoundingClientRect().width),height:Math.round(x.getBoundingClientRect().height)}));
                  return {
                    count:icons.length,
                    rects,
                    docWidth:document.documentElement.scrollWidth,
                    viewportWidth:window.innerWidth,
                    step:document.querySelectorAll('.consultation-flow .cd-flow-icon').length,
                    features:document.querySelectorAll('.sec-about .cd-card-icon').length,
                    reasons:document.querySelectorAll('.sec-reason .cd-card-icon').length,
                    assurance:document.querySelectorAll('.sec-price .cd-assurance-icon').length,
                    lineUrl:document.querySelector('.hero .line-cta')?.href||'',
                    title:document.title
                  }
                });
                if(response.status()!==200)throw Error('PAGE_HTTP_'+response.status());
                if(errors.length)throw Error('JS_ERROR '+JSON.stringify(errors));
                if(data.count!==12 || data.step!==3 || data.features!==3 || data.reasons!==3 || data.assurance!==3)throw Error('ICON_GROUP_COUNT '+JSON.stringify(data));
                if(data.docWidth>data.viewportWidth)throw Error('HORIZONTAL_OVERFLOW '+JSON.stringify(data));
                if(!data.lineUrl.startsWith('https://lin.ee/'))throw Error('LINE_CTA_MISSING');
                for(let i=0;i<12;i++){
                  if(!data.rects[i].src.endsWith(expected[i]))throw Error('ICON_ORDER '+i+' '+data.rects[i].src);
                  if(!data.rects[i].loaded||data.rects[i].width<38||data.rects[i].height<38)throw Error('ICON_DECODE_OR_SIZE '+JSON.stringify(data.rects[i]));
                }
                fs.mkdirSync('qa-screenshots',{recursive:true});
                for(const [label,selector] of [['steps','.consultation-flow'],['features','.about-feature-list'],['reasons','.reason-cards'],['assurance','.price-insurance-card']]){
                  await page.locator(selector).screenshot({path:'qa-screenshots/'+width+'-'+label+'.png'});
                }
                results.push({width,status:'PASS',...data,errors});
                await context.close();
              }
              console.log('COMPLETE_ICONS_QA '+JSON.stringify({status:'PASS',cases:results}));
            }finally{await b.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
      - name: Verify live GitHub Pages icons and responsive layout
        shell: bash
        run: |
          node <<'JS'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const names=[
              '01-step-line.webp','02-step-quote.webp','03-step-visit.webp',
              '04-feature-drainpan-fan.webp','05-feature-deep-dirt.webp','06-feature-circuit.webp',
              '07-reason-deep.webp','08-reason-odor.webp','09-reason-clean.webp',
              '10-assurance-insurance.webp','11-assurance-check.webp','12-assurance-repair.webp'];
            const b=await chromium.launch({headless:true});
            const outcomes=[];
            try {
              for(const width of [1440,390,320]){
                const context=await b.newContext({viewport:{width,height:900},reducedMotion:'reduce'});
                const page=await context.newPage();
                await page.route('**/*',route=>{
                  const host=new URL(route.request().url()).hostname;
                  if(host==='teruya1229.github.io')return route.continue();
                  return route.abort('blockedbyclient');
                });
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const resp=await page.goto('https://teruya1229.github.io/complete-disassembly/?verify_icons=20261108',{waitUntil:'domcontentloaded',timeout:45000});
                if(resp.status()!==200)throw Error('LIVE_HTTP '+resp.status());
                const icons=page.locator('img[src*="/assets/icons/"]');
                if(await icons.count()!==12)throw Error('LIVE_COUNT '+await icons.count());
                const statuses=[];
                for(let i=0;i<12;i++){
                  const el=icons.nth(i);
                  await el.scrollIntoViewIfNeeded({timeout:12000});
                  await el.evaluate(img=>{img.loading='eager';});
                  await page.waitForFunction(i=>{const img=document.querySelectorAll('img[src*="/assets/icons/"]')[i];return !!img.currentSrc && img.complete;},i,{timeout:18000});
                  await el.evaluate(async img=>{
                    const url=new URL(img.getAttribute('src'),document.baseURI).href;
                    const response=await fetch(url,{cache:'no-store'});
                    if(response.status!==200 || !(response.headers.get('content-type')||'').includes('image/'))throw Error('LIVE_ICON_HTTP '+url+' '+response.status+' '+response.headers.get('content-type'));
                    try{await img.decode()}catch(e){throw Error('LIVE_IMAGE_DECODE '+url+' naturalWidth='+img.naturalWidth+' '+e.message);}
                  });
                  const result=await el.evaluate(img=>({src:img.getAttribute('src'),w:img.naturalWidth,h:img.naturalHeight,rect:img.getBoundingClientRect().width}));
                  if(!result.src.endsWith(names[i])||result.w!==192||result.h!==192||result.rect<38)throw Error('LIVE_ICON_BAD '+JSON.stringify({i,...result}));
                  statuses.push(result);
                }
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                if(overflow>0)throw Error('LIVE_OVERFLOW '+width+':'+overflow);
                if(errors.length)throw Error('LIVE_JS_ERRORS '+JSON.stringify(errors));
                await page.locator('.consultation-flow').screenshot({path:'qa-screenshots/'+width+'-LIVE-steps.png'});
                await page.locator('.sec-reason .reason-cards').screenshot({path:'qa-screenshots/'+width+'-LIVE-reasons.png'});
                outcomes.push({width,http:resp.status(),icons:statuses.length,decoded:true,overflow,errors:errors.length,status:'PASS'});
                await context.close();
              }
              console.log('COMPLETE_ICONS_LIVE_QA '+JSON.stringify({status:'PASS',cases:outcomes}));
            }finally{await b.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)})
          JS
      - name: Save visual screenshots for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-icons-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
