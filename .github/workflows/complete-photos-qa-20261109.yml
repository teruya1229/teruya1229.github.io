name: Complete-disassembly photo refresh QA 20261109
on:
  push:
    branches: [feat/complete-photo-refresh-20261109]
    paths:
      - 'complete-disassembly/**'
      - '.github/workflows/complete-photos-qa-20261109.yml'
permissions:
  contents: read
jobs:
  photo-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check images, text, responsiveness, and errors
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/complete-photos-http.log 2>&1 &
          node <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            try {
              for(const width of [1440,820,390,320]){
                const ctx=await browser.newContext({viewport:{width,height:900}});
                const page=await ctx.newPage();
                await page.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:8765/')?r.continue():r.abort('blockedbyclient'));
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const response=await page.goto('http://127.0.0.1:8765/complete-disassembly/',{waitUntil:'domcontentloaded',timeout:30000});
                if(response.status()!==200)throw Error('HTTP_'+response.status());
                const imgs=page.locator('.sec-beforeafter-refresh img.svc-card-img');
                if(await imgs.count()!==2)throw Error('LOWER_IMAGE_COUNT');
                const expected=['coil-before-after.webp','fan-before-after.webp'];
                const observed=[];
                for(let i=0;i<2;i++){
                  const img=imgs.nth(i);
                  await img.evaluate(el=>{el.loading='eager'});
                  await img.scrollIntoViewIfNeeded();
                  await page.waitForFunction(i=>{
                    const el=document.querySelectorAll('.sec-beforeafter-refresh img.svc-card-img')[i];
                    return !!el?.currentSrc && el.complete;
                  },i,{timeout:15000});
                  await img.evaluate(async el=>await el.decode());
                  const info=await img.evaluate(el=>({src:el.getAttribute('src'),naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,objectFit:getComputedStyle(el).objectFit,aspectRatio:getComputedStyle(el).aspectRatio}));
                  if(!info.src.endsWith(expected[i])||info.naturalWidth!==1200||info.naturalHeight<400||info.objectFit!=='contain')throw Error('IMAGE_INVALID_'+JSON.stringify(info));
                  observed.push(info);
                }
                if(await page.locator('.sec-beforeafter-refresh').getByText('熱交換器のビフォーアフター').count()!==1)throw Error('COIL_CAPTION_MISSING');
                if(await page.locator('.sec-beforeafter-refresh').getByText('送風ファン・内部のビフォーアフター').count()!==1)throw Error('FAN_CAPTION_MISSING');
                const other=await page.evaluate(()=>({
                  parts:!!document.querySelector('img[src="./parts-clean-optimized.jpg"]'),
                  reusedFan:Array.from(document.images).filter(x=>x.getAttribute('src')==='./fan-before-after-optimized.jpg').length,
                  reusedWater:Array.from(document.images).filter(x=>x.getAttribute('src')==='./dirty-water-optimized.jpg').length,
                  scrollWidth:document.documentElement.scrollWidth,
                  viewportWidth:window.innerWidth,
                  lineLink:document.querySelector('.hero .line-cta')?.href
                }));
                if(other.reusedFan!==1||other.reusedWater!==1||!other.parts||other.scrollWidth>other.viewportWidth||!other.lineLink?.startsWith('https://lin.ee/'))throw Error('REGRESSION '+JSON.stringify(other));
                if(errors.length)throw Error('JS_ERRORS '+JSON.stringify(errors));
                fs.mkdirSync('qa-photos',{recursive:true});
                await page.locator('.sec-beforeafter-refresh').screenshot({path:'qa-photos/photos-'+width+'.png'});
                results.push({width,http:200,images:observed,overflow:0,jsErrors:0,other});
                await ctx.close();
              }
              console.log('COMPLETE_PHOTOS_QA '+JSON.stringify({status:'PASS',tested:results.length,results}));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
      - name: Verify published comparison photos on live GitHub Pages
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const results=[];
            try{
              for(const width of [1440,390,320]){
                const c=await b.newContext({viewport:{width,height:900}});
                const p=await c.newPage();
                await p.route('**/*',r=>{
                  const host=new URL(r.request().url()).hostname;
                  return host==='teruya1229.github.io'?r.continue():r.abort('blockedbyclient');
                });
                const errors=[];
                p.on('pageerror',e=>errors.push(e.message));
                const response=await p.goto('https://teruya1229.github.io/complete-disassembly/?photo_qa=20261109',{waitUntil:'domcontentloaded',timeout:40000});
                if(response.status()!==200)throw Error('LIVE_HTTP_'+response.status());
                const icons=p.locator('.sec-beforeafter-refresh img.svc-card-img');
                if(await icons.count()!==2)throw Error('LIVE_PHOTO_COUNT');
                const names=['coil-before-after.webp','fan-before-after.webp'];
                for(let i=0;i<2;i++){
                  const img=icons.nth(i);
                  await img.evaluate(el=>{el.loading='eager'});
                  await img.scrollIntoViewIfNeeded();
                  await p.waitForFunction(i=>{
                    const el=document.querySelectorAll('.sec-beforeafter-refresh img.svc-card-img')[i];
                    return !!el?.currentSrc && el.complete;
                  },i,{timeout:15000});
                  const data=await img.evaluate(async el=>{
                    const link=new URL(el.getAttribute('src'),document.baseURI).href;
                    const res=await fetch(link,{cache:'no-store'});
                    if(!res.ok || !(res.headers.get('content-type')||'').includes('image/'))throw Error('PHOTO_HTTP '+res.status+' '+link);
                    await el.decode();
                    return {src:el.getAttribute('src'),w:el.naturalWidth,h:el.naturalHeight,fit:getComputedStyle(el).objectFit};
                  });
                  if(!data.src.endsWith(names[i])||data.w!==1200||data.h<400||data.fit!=='contain')throw Error('LIVE_IMAGE_BAD_'+JSON.stringify(data));
                }
                const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                if(overflow>0 || errors.length)throw Error('OVERFLOW_OR_JS '+width+' '+overflow+' '+JSON.stringify(errors));
                fs.mkdirSync('qa-photos',{recursive:true});
                await p.locator('.sec-beforeafter-refresh').screenshot({path:'qa-photos/LIVE-'+width+'.png'});
                results.push({width,status:'PASS',http:200,images:2,decoded:true,overflow,errors:0});
                await c.close();
              }
              console.log('COMPLETE_PHOTOS_LIVE_QA '+JSON.stringify({status:'PASS',results}));
            }finally{await b.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-photos-predeploy-qa
          path: qa-photos/
          if-no-files-found: ignore
