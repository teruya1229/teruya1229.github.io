name: Complete-disassembly photo refresh QA 20261109
on:
  push:
    branches: [feat/complete-photo-refresh-20261109, feat/complete-parts-photo-20261109]
    paths:
      - 'complete-disassembly/**'
      - '.github/workflows/complete-photos-qa-20261109.yml'
permissions:
  contents: read
jobs:
  photo-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check images, text, responsiveness, and errors
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/complete-photos-http.log 2>&1 &
          node <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];
            try {
              for(const width of [1440,820,390,320]){
                const ctx=await browser.newContext({viewport:{width,height:900}});
                const page=await ctx.newPage();
                await page.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:8765/')?r.continue():r.abort('blockedbyclient'));
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const response=await page.goto('http://127.0.0.1:8765/complete-disassembly/',{waitUntil:'domcontentloaded',timeout:30000});
                if(response.status()!==200)throw Error('HTTP_'+response.status());
                const parts=page.locator('img[src="./assets/photos/parts-ready-560.webp"]');
                if(await parts.count()!==1)throw Error('PARTS_IMG_COUNT '+await parts.count());
                await parts.evaluate(img=>{img.loading='eager'});
                await parts.scrollIntoViewIfNeeded();
                await page.waitForFunction(()=>{
                  const img=document.querySelector('img[src="./assets/photos/parts-ready-560.webp"]');
                  return !!img?.currentSrc && img.complete;
                },{timeout:12000});
                await parts.evaluate(async el=>await el.decode());
                const partsInfo=await parts.evaluate(el=>({src:el.getAttribute('src'),naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight}));
                if(partsInfo.naturalWidth!==560||partsInfo.naturalHeight!==373)throw Error('PARTS_IMG_DIM '+JSON.stringify(partsInfo));
                const imgs=page.locator('.sec-beforeafter-refresh img.svc-card-img');
                if(await imgs.count()!==2)throw Error('LOWER_IMAGE_COUNT');
                const expected=['coil-before-after.webp','fan-before-after.webp'];
                const observed=[];
                for(let i=0;i<2;i++){
                  const img=imgs.nth(i);
                  await img.evaluate(el=>{el.loading='eager'});
                  await img.scrollIntoViewIfNeeded();
                  await page.waitForFunction(i=>{
                    const el=document.querySelectorAll('.sec-beforeafter-refresh img.svc-card-img')[i];
                    return !!el?.currentSrc && el.complete;
                  },i,{timeout:15000});
                  await img.evaluate(async el=>await el.decode());
                  const info=await img.evaluate(el=>({src:el.getAttribute('src'),naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight,objectFit:getComputedStyle(el).objectFit,aspectRatio:getComputedStyle(el).aspectRatio}));
                  if(!info.src.endsWith(expected[i])||info.naturalWidth!==1200||info.naturalHeight<400||info.objectFit!=='contain')throw Error('IMAGE_INVALID_'+JSON.stringify(info));
                  observed.push(info);
                }
                if(await page.locator('.sec-beforeafter-refresh').getByText('熱交換器のビフォーアフター').count()!==1)throw Error('COIL_CAPTION_MISSING');
                if(await page.locator('.sec-beforeafter-refresh').getByText('送風ファン・内部のビフォーアフター').count()!==1)throw Error('FAN_CAPTION_MISSING');
                const other=await page.evaluate(()=>({
                  parts:document.querySelector('img[src="./assets/photos/parts-ready-560.webp"]')?.naturalWidth,
                  reusedFan:Array.from(document.images).filter(x=>x.getAttribute('src')==='./fan-before-after-optimized.jpg').length,
                  reusedWater:Array.from(document.images).filter(x=>x.getAttribute('src')==='./dirty-water-optimized.jpg').length,
                  scrollWidth:document.documentElement.scrollWidth,
                  viewportWidth:window.innerWidth,
                  lineLink:document.querySelector('.hero .line-cta')?.href
                }));
                if(other.reusedFan!==1||other.reusedWater!==1||other.parts!==560||other.scrollWidth>other.viewportWidth||!other.lineLink?.startsWith('https://lin.ee/'))throw Error('REGRESSION '+JSON.stringify(other));
                if(errors.length)throw Error('JS_ERRORS '+JSON.stringify(errors));
                fs.mkdirSync('qa-photos',{recursive:true});
                await page.locator('.sec-beforeafter-refresh').screenshot({path:'qa-photos/photos-'+width+'.png'});
                await parts.locator('..').screenshot({path:'qa-photos/parts-'+width+'.png'});
                results.push({width,http:200,images:observed,overflow:0,jsErrors:0,other});
                await ctx.close();
              }
              console.log('COMPLETE_PHOTOS_QA '+JSON.stringify({status:'PASS',tested:results.length,results}));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
      - name: Verify publicly deployed parts photograph on GitHub Pages
        run: |
          node <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const results=[];
            try {
              for(const width of [1440,390,320]){
                const c=await b.newContext({viewport:{width,height:900},reducedMotion:'reduce'});
                const p=await c.newPage();
                await p.route('**/*',r=>{
                  const hostname=new URL(r.request().url()).hostname;
                  return hostname==='teruya1229.github.io'?r.continue():r.abort('blockedbyclient');
                });
                const errors=[];
                p.on('pageerror',e=>errors.push(e.message));
                const response=await p.goto('https://teruya1229.github.io/complete-disassembly/?parts_verify=20261109',{waitUntil:'domcontentloaded',timeout:45000});
                if(response.status()!==200)throw Error('LIVE_PAGE_HTTP '+response.status());
                const img=p.locator('img[src="./assets/photos/parts-ready-560.webp"]');
                if(await img.count()!==1)throw Error('LIVE_PARTS_IMAGE_NOT_PRESENT');
                await img.evaluate(el=>{el.loading='eager'});
                await img.scrollIntoViewIfNeeded();
                await p.waitForFunction(()=>{
                  const el=document.querySelector('img[src="./assets/photos/parts-ready-560.webp"]');
                  return !!el?.currentSrc && el.complete;
                },null,{timeout:15000});
                const info=await img.evaluate(async el=>{
                  const url=new URL(el.getAttribute('src'),document.baseURI).href;
                  const res=await fetch(url,{cache:'no-store'});
                  if(!res.ok||(res.headers.get('content-type')||'').indexOf('image/webp')<0)throw Error('IMAGE_HTTP_OR_TYPE '+res.status+' '+res.headers.get('content-type'));
                  await el.decode();
                  return {url,src:el.getAttribute('src'),w:el.naturalWidth,h:el.naturalHeight,rect:el.getBoundingClientRect().width,alt:el.alt};
                });
                if(info.w!==560||info.h!==373||info.rect<100||!info.alt.includes('完全分解'))throw Error('LIVE_PARTS_MISMATCH '+JSON.stringify(info));
                const other=await p.evaluate(()=>({
                  comparePhotos:document.querySelectorAll('.sec-beforeafter-refresh img.svc-card-img').length,
                  icons:document.querySelectorAll('img[src*="/assets/icons/"]').length,
                  overflow:document.documentElement.scrollWidth-window.innerWidth,
                  line:document.querySelector('.hero .line-cta')?.href
                }));
                if(other.comparePhotos!==2||other.icons!==12||other.overflow>0||!other.line?.startsWith('https://lin.ee/')||errors.length)throw Error('LIVE_REGRESSION '+JSON.stringify(other)+' '+JSON.stringify(errors));
                fs.mkdirSync('qa-photos',{recursive:true});
                await img.locator('..').screenshot({path:'qa-photos/LIVE-parts-'+width+'.png'});
                results.push({width,status:'PASS',pageHTTP:200,imageHTTP:200,image:info.src,decoded:true,overflow:0,errors:0});
                await c.close();
              }
              console.log('COMPLETE_PARTS_LIVE_QA '+JSON.stringify({status:'PASS',results}));
            } finally {await b.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-photos-predeploy-qa
          path: qa-photos/
          if-no-files-found: ignore
