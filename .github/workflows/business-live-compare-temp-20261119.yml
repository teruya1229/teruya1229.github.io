name: Business LP temporary production-browser verification
on:
  push:
    branches: [test/business-live-compare-20261119]
    paths:
      - '.github/workflows/business-live-compare-temp-20261119.yml'
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Chrome
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          google-chrome --version
      - name: Verify live HTTP response, visible copy and image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-business-live
          curl -fsSL --retry 2 --max-time 30 -o qa-business-live/live.html 'https://teruya1229.github.io/business-cleaning/?qa=bc-live-20261119'
          python3 <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from pathlib import Path
          import json
          body=Path('qa-business-live/live.html').read_text(encoding='utf-8')
          for word in ['今の清掃と比較・検討','まずは見積りで比較。','今の清掃会社を変えると決めていなくても','business_contact_click','賠償責任保険']:
            if word not in body: raise RuntimeError('MISSING_LIVE_COPY '+word)
          if '初回剥離ワックス半額' in body: raise RuntimeError('UNCONFIRMED_PROMO')
          class Links(HTMLParser):
            def __init__(self):
              super().__init__()
              self.img=[];self.links=[];self.styles=[]
            def handle_starttag(self, tag, attrs):
              d=dict(attrs)
              if tag=='img' and 'src' in d:self.img.append(d['src'])
              if tag=='a' and 'href' in d:self.links.append(d['href'])
              if tag=='link' and d.get('rel')=='stylesheet':self.styles.append(d['href'])
          p=Links();p.feed(body)
          if len(p.img)!=6 or sum('curama.jp' in x for x in p.links)<8 or sum('lin.ee' in x for x in p.links)<3:raise RuntimeError('ASSET_OR_LINK_COUNT')
          urls=[urljoin('https://teruya1229.github.io/business-cleaning/',x) for x in p.img+p.styles]
          status={}
          for u in urls:
            with urlopen(Request(u,headers={'User-Agent':'BC-LP-QA'}),timeout=20) as r:
              status[u]=r.status
              if r.status!=200:raise RuntimeError('BAD_ASSET '+u+' '+str(r.status))
          report={'publicHTML':'HTTP200','images':len(p.img),'reviewLinks':sum('curama.jp' in x for x in p.links),'lineLinks':sum('lin.ee' in x for x in p.links),'stylesheets':p.styles,'assetStatuses':status}
          Path('qa-business-live/http-results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('BUSINESS_LIVE_HTTP_QA_PASS '+json.dumps(report,ensure_ascii=False))
          PY
      - name: Capture real website on 1440, 390, 320 Chrome viewports without DOM eval
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const URL='https://teruya1229.github.io/business-cleaning/?qa=bc-live-browser-20261119';
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const stats=[];
            try{
              for(const width of [1440,390,320]){
                const context=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
                const page=await context.newPage();
                await page.route('**/*',route=>{
                  if(route.request().url().startsWith('https://teruya1229.github.io/'))return route.continue();
                  return route.abort('blockedbyclient');
                });
                const response=await page.goto(URL,{waitUntil:'domcontentloaded',timeout:35000});
                await page.waitForTimeout(1300);
                const filename='qa-business-live/screenshot-'+width+'.png';
                await page.screenshot({path:filename,animations:'disabled',caret:'hide'});
                const png=fs.readFileSync(filename);
                const actualWidth=png.readUInt32BE(16);
                const size=png.length;
                stats.push({width,actualWidth,status:response.status(),size});
                if(actualWidth!==width||response.status()!==200||size<8000)throw new Error('BAD_SCREENSHOT '+JSON.stringify(stats[stats.length-1]));
                await context.close();
              }
              fs.writeFileSync('qa-business-live/browser-results.json',JSON.stringify(stats,null,2));
              console.log('BUSINESS_LIVE_CHROME_SCREENSHOTS_PASS '+JSON.stringify(stats));
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Preserve evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-business-live-final-20261119
          path: qa-business-live/
          if-no-files-found: warn
