name: Business LP temporary production-browser verification
on:
  push:
    branches: [test/business-live-compare-20261119]
    paths:
      - '.github/workflows/business-live-compare-temp-20261119.yml'
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Chrome
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          google-chrome --version
      - name: Visit actual production URL in Chrome at three widths
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const URL='https://teruya1229.github.io/business-cleaning/?qa=business-compare-20261119';
          const origin='https://teruya1229.github.io/';
          const results=[];
          fs.mkdirSync('qa-business-live',{recursive:true});
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true});
            try{
              for(const width of [1440,390,320]){
                const ctx=await browser.newContext({viewport:{width,height:860},deviceScaleFactor:1,reducedMotion:'reduce'});
                const page=await ctx.newPage();
                const errors=[];
                const notFound=[];
                page.on('pageerror',e=>errors.push(e.message));
                page.on('response',r=>{
                  if(r.url().startsWith(origin)&&r.status()>=400)notFound.push({url:r.url(),status:r.status()});
                });
                await page.route('**/*',route=>{
                  if(route.request().url().startsWith(origin))return route.continue();
                  return route.abort('blockedbyclient');
                });
                const response=await page.goto(URL,{waitUntil:'domcontentloaded',timeout:35000});
                await page.locator('img[src]').evaluateAll(els=>els.forEach(x=>x.loading='eager'));
                await page.waitForTimeout(1100);
                const d=await page.evaluate(()=>{
                  const img=[...document.querySelectorAll('img[src]')].map(el=>({
                    src:el.getAttribute('src'),ok:el.complete&&el.naturalWidth>0
                  }));
                  const quote=document.querySelector('#estimate .biz3-quote-heading');
                  const reason=document.querySelector('#benefits .biz3-benefit-item:nth-child(3) h3');
                  const copy=document.querySelector('#estimate .biz3-quote-lead');
                  const bounds=(el)=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,width:r.width,clientWidth:el.clientWidth,scrollWidth:el.scrollWidth};};
                  return {
                    pageWidth:document.documentElement.scrollWidth,viewport:window.innerWidth,
                    images:img,reason:reason?.textContent.trim(),quote:quote?.textContent.trim(),
                    intro:copy?.textContent.slice(0,160),reasonBounds:bounds(reason),quoteBounds:bounds(quote),
                    faq:document.querySelectorAll('#faq details').length,
                    reviewLinks:document.querySelectorAll('a[href*="curama.jp/"]').length,
                    lineLinks:[...document.querySelectorAll('a[href^="https://lin.ee/"]')].map(a=>a.href),
                    telLinks:[...document.querySelectorAll('a[href^="tel:"]')].map(a=>a.href),
                    businessEvent:document.documentElement.outerHTML.includes('business_contact_click'),
                    unverifiedPromo:document.body.innerText.includes('初回剥離ワックス半額')
                  };
                });
                const first=page.locator('#faq details').first();
                await first.locator('summary').click();
                const opened=await first.evaluate(x=>x.open);
                await first.locator('summary').click();
                const closed=!(await first.evaluate(x=>x.open));
                await page.locator('.biz3-hero').screenshot({path:'qa-business-live/hero-'+width+'.png'});
                await page.locator('#benefits').screenshot({path:'qa-business-live/benefits-'+width+'.png'});
                await page.locator('#estimate').screenshot({path:'qa-business-live/estimate-'+width+'.png'});
                const ok=response.status()===200 &&
                  d.pageWidth<=width+1 && d.images.length===6 && d.images.every(x=>x.ok) &&
                  d.reason.includes('今の清掃と比較')&&d.quote.includes('まずは見積りで比較') &&
                  d.intro.includes('今の清掃会社を変えると決めていなくても') &&
                  d.reasonBounds.scrollWidth<=d.reasonBounds.clientWidth+1 &&
                  d.quoteBounds.scrollWidth<=d.quoteBounds.clientWidth+1 &&
                  d.faq===7 && d.reviewLinks>=8 && d.lineLinks.length>=3 && d.telLinks.length>=1 &&
                  d.businessEvent && !d.unverifiedPromo && opened && closed && errors.length===0 && notFound.length===0;
                results.push({width,ok,status:response.status(),opened,closed,errors,notFound,...d});
                await ctx.close();
              }
              fs.writeFileSync('qa-business-live/results.json',JSON.stringify(results,null,2));
              console.log('BUSINESS_LIVE_QA_RESULTS='+JSON.stringify(results.map(x=>({width:x.width,ok:x.ok,status:x.status,images:x.images.length,reviewLinks:x.reviewLinks,faq:x.faq,overflow:x.pageWidth-x.viewport,errors:x.errors.length,missingAssets:x.notFound.length}))));
              if(results.some(x=>!x.ok))throw new Error('BUSINESS_LIVE_QA_FAILURE');
              console.log('BUSINESS_LIVE_QA_ALL_PASS');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Preserve evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-business-live-final-20261119
          path: qa-business-live/
          if-no-files-found: warn
