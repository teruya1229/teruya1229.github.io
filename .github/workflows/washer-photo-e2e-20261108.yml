name: Washer photo and typo browser verification
on:
  push:
    branches: [feat/washing-photo-typo-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test photos and mobile/desktop layout
        run: node washing-machine-cleaning/tests/photos-e2e-20261108.cjs
      - name: Upload full screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: washer-photo-layout-proof
          path: ${{ runner.temp }}/washer-photo-qa/
          if-no-files-found: warn
