name: South hub production Chrome final QA 20261119
on:
  push:
    branches: [qa/south-live-20261119]
    paths: [.github/workflows/south-live-20261119.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Japanese font and Chrome
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Inspect South hub public URL 1440 390 320
        run: node qa/south-live-20261119.cjs
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: south-live-20261119, path: qa-south-live-20261119/, if-no-files-found: warn}
