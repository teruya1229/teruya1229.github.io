name: House cleaning production final QA
on:
  push:
    branches: [qa/house-live-final-20261119]
    paths: [.github/workflows/house-live-final-20261119.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese fonts and Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Verify production code, photos and responsive layout
        run: |
          mkdir -p /tmp/house-final
          node <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome'});
            let report=[];
            try{
              for(const width of [1440,390,320]){
                const ctx=await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
                const page=await ctx.newPage();
                const bad=[],errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                page.on('response',r=>{if(r.url().startsWith('https://teruya1229.github.io/')&&r.status()>=400)bad.push(r.status()+' '+r.url())});
                await page.route('**/*',r=>{const u=r.request().url();return u.startsWith('https://teruya1229.github.io/')||u.startsWith('data:')?r.continue():r.abort()});
                let http=0;
                for(let attempt=0;attempt<6;attempt++){
                  const r=await page.goto('https://teruya1229.github.io/house-cleaning/',{waitUntil:'domcontentloaded',timeout:45000});
                  http=r.status();
                  if(await page.locator('.floor-review').count())break;
                  if(attempt<5)await page.waitForTimeout(3500);
                }
                await page.locator('img').evaluateAll(imgs=>imgs.forEach(i=>i.loading='eager'));
                await page.evaluate(async()=>{await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));for(let y=0;y<document.documentElement.scrollHeight;y+=650){scrollTo(0,y);await new Promise(r=>setTimeout(r,15))};scrollTo(0,0)});
                await page.waitForTimeout(300);
                const metrics=await page.evaluate(()=>{
                  const q=document.querySelector('.floor-review');
                  return {scrollWidth:document.documentElement.scrollWidth,width:innerWidth,height:document.documentElement.scrollHeight,reviewFound:!!q,reviewSource:q?.querySelector('a')?.href,reviewText:q?.querySelector('blockquote')?.textContent,reviewDate:q?.querySelector('time')?.dateTime,claimRemoved:!document.body.innerText.includes('洗浄するのが確実'),images:[...document.images].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0})),faq:document.querySelectorAll('#faq details').length,line:document.querySelectorAll('a[href*="lin.ee"]').length,stylePresent:getComputedStyle(q||document.body).borderLeftWidth,fonts:document.fonts.check('16px "Noto Sans CJK JP"','日本語')};
                });
                await page.screenshot({path:'/tmp/house-final/live-'+width+'-full.png',fullPage:true,timeout:60000,animations:'disabled'});
                for(let i=0;i<metrics.faq;i++){const f=page.locator('#faq details').nth(i);await f.locator('summary').click();if(!await f.evaluate(e=>e.open))errors.push('FAQ '+i);await f.locator('summary').click()}
                report.push({http,...metrics,bad,errors});
                await ctx.close();
              }
              fs.writeFileSync('/tmp/house-final/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
              if(report.some(x=>x.http!==200||!x.reviewFound||!x.reviewSource?.includes('48cf7cb4-d1eb-4083-a0a8-f8d54071447c')||!x.claimRemoved||x.reviewDate!=='2023-12-20'||x.scrollWidth>x.width||x.images.some(i=>!i.loaded)||x.faq!==10||x.line!==9||x.bad.length||x.errors.length))process.exitCode=1;
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Archive proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-live-final-20261119
          path: /tmp/house-final/
          if-no-files-found: warn
