name: Prices LP 20261119 before after Chrome QA
on:
  push:
    branches: [improve/prices-two-axis-20261119]
    paths: [.github/workflows/prices-preview-20261119.yml]
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Japanese font and Playwright
        run: |
          sudo mkdir -p /usr/local/share/fonts/qa-japanese
          sudo curl -fLsS --retry 2 --max-time 75 -o /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          test "$(stat -c %s /usr/local/share/fonts/qa-japanese/NotoSansCJKjp-Regular.otf)" -gt 10000000
          sudo fc-cache -f >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
      - name: Compare live base and revised prices LP
        run: node qa/prices-preview-20261119.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: prices-preview-20261119, path: qa-prices/, if-no-files-found: warn}
