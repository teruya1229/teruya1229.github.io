<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<title>BCサービス 現場ツール</title>
<style>
  :root{
    --bg:#f4f5f7;--card:#fff;--text:#111;--muted:#667085;--line:#dfe3e8;
    --accent:#111;--soft:#f7f8fa;--candidate:#fff8d8;--candidate-line:#e8c95d;
    --ok:#0a6b2d;--warn:#8a5a00;--danger:#9f1b1b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
  body{overflow:hidden}
  button,input,select{font:inherit}
  button{cursor:pointer}
  .app{height:100dvh;display:flex;flex-direction:column;min-height:0}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left)) 8px max(10px,env(safe-area-inset-right));z-index:10}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1180px;margin:0 auto}
  .brand{min-width:0}
  .brand b{display:block;font-size:16px;line-height:1.2}
  .brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:240px}
  .tab{border:1px solid var(--line);background:#fff;color:#111;border-radius:10px;padding:10px 12px;font-weight:800;min-height:42px}
  .tab[aria-selected="true"]{background:#111;color:#fff;border-color:#111}
  .bridge{background:#fff;border-bottom:1px solid var(--line);z-index:9}
  .bridge-inner{max-width:1180px;margin:0 auto;padding:8px 10px}
  details.bridge-card{background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  details.bridge-card>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font-weight:800;cursor:pointer}
  details.bridge-card>summary::-webkit-details-marker{display:none}
  details.bridge-card>summary:after{content:"＋";font-size:18px}
  details.bridge-card[open]>summary:after{content:"－"}
  .bridge-body{border-top:1px solid var(--line);padding:10px 12px;background:#fff;max-height:46dvh;overflow:auto}
  .lead{margin:0 0 10px;font-size:12px;line-height:1.5;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .field{min-width:0}
  .field label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}
  .field input,.field select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;font-size:16px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .btn{border:0;border-radius:10px;min-height:42px;padding:10px 14px;font-weight:800}
  .btn-primary{background:#111;color:#fff}
  .btn-secondary{background:#eceff2;color:#111}
  .btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #f0c8c8}
  .status{font-size:12px;margin:8px 0 0;color:var(--muted);line-height:1.5}
  .status.ok{color:var(--ok)}
  .status.warn{color:var(--warn)}
  .candidate-box{background:var(--candidate);border:1px solid var(--candidate-line);border-radius:10px;padding:10px;margin-bottom:10px}
  .candidate-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .candidate-head b{font-size:14px}
  .candidate-head span{font-size:11px;color:#6b5700}
  .candidate-list{display:grid;gap:7px;margin-top:8px}
  .candidate-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start;background:#fff;border:1px solid #eadc9a;border-radius:9px;padding:9px}
  .candidate-row input{width:22px;height:22px;margin:0;accent-color:#111}
  .candidate-name{font-weight:800;font-size:14px;line-height:1.3}
  .candidate-meta{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mini{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
  .mini h3{font-size:12px;margin:0 0 6px}
  .mini ul{margin:0;padding-left:18px;font-size:12px;line-height:1.55}
  .empty{font-size:12px;color:var(--muted);margin:0}
  .workspace{flex:1;min-height:0;position:relative;background:#e9ecef}
  .frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .frame[hidden]{display:none}
  .loading{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted);pointer-events:none}
  .loading[hidden]{display:none}
  @media(max-width:760px){
    .topline{align-items:stretch;flex-direction:column;gap:7px}
    .brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
    .brand span{margin:0;text-align:right}
    .tabs{min-width:0;width:100%}
    .tab{padding:9px 8px}
    .bridge-inner{padding:6px}
    .bridge-body{max-height:52dvh;padding:9px}
    .grid{grid-template-columns:1fr 1fr}
    .split{grid-template-columns:1fr}
  }
  @media(max-width:390px){
    .brand b{font-size:15px}
    .brand span{font-size:10px}
    .grid{grid-template-columns:1fr 1fr}
    .field label{font-size:10px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topline">
      <div class="brand">
        <b>BCサービス 現場ツール</b>
        <span>写真判定＋内部見積</span>
      </div>
      <nav class="tabs" aria-label="現場ツール切替">
        <button id="tabDiagnosis" class="tab" type="button" aria-selected="true">写真判定</button>
        <button id="tabEstimate" class="tab" type="button" aria-selected="false">見積</button>
      </nav>
    </div>
  </header>

  <section class="bridge" aria-label="写真判定と見積の連携">
    <div class="bridge-inner">
      <details id="diagnosisBridge" class="bridge-card">
        <summary>見積連携入力 <span style="font-size:11px;color:#667085;font-weight:600">候補だけ作成・自動加算なし</span></summary>
        <div class="bridge-body">
          <p class="lead">写真判定の入力を読み取り、見積候補だけを別保存します。既存の写真・案件保存、AI経路、料金マスター、<code>bc_quote_state</code>はここでは変更しません。</p>
          <div class="grid">
            <div class="field"><label for="installCount">取付台数</label><input id="installCount" type="number" min="0" step="1" inputmode="numeric" placeholder="自動候補"></div>
            <div class="field"><label for="removeCount">取外し台数</label><input id="removeCount" type="number" min="0" step="1" inputmode="numeric" placeholder="自動候補"></div>
            <div class="field"><label for="pipeExtension">標準超過 配管延長m</label><input id="pipeExtension" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0"></div>
            <div class="field"><label for="billableWire">課金対象 配線延長m</label><input id="billableWire" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0"></div>
            <div class="field"><label for="holeCount">穴あけ箇所数</label><input id="holeCount" type="number" min="0" step="1" inputmode="numeric" placeholder="候補なら1"></div>
            <div class="field"><label for="coverLength">化粧カバー実長m</label><input id="coverLength" type="number" min="0" step="0.1" inputmode="decimal" placeholder="未確認可"></div>
            <div class="field"><label for="coverFittings">カバー曲がり等 部材数</label><input id="coverFittings" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></div>
            <div class="field"><label for="highWorkDetail">高所区分</label><select id="highWorkDetail"><option value="">未確認</option><option value="roof_wall">屋根置き・壁面など</option><option value="other">その他高所</option><option value="none">高所なし</option></select></div>
          </div>
          <div class="actions">
            <button id="createCandidatesBtn" class="btn btn-primary" type="button">見積候補を作成して見積へ</button>
            <button id="previewCandidatesBtn" class="btn btn-secondary" type="button">候補だけ確認</button>
          </div>
          <p id="diagnosisStatus" class="status">見積へ反映するまでは金額は変わりません。</p>
        </div>
      </details>

      <details id="estimateBridge" class="bridge-card" hidden open>
        <summary>写真判定候補 <span style="font-size:11px;color:#667085;font-weight:600">チェックした項目だけ見積へ反映</span></summary>
        <div class="bridge-body">
          <div id="candidateArea"></div>
          <div class="actions">
            <button id="clearCandidatesBtn" class="btn btn-danger" type="button">候補データだけ削除</button>
          </div>
          <p id="estimateStatus" class="status">単価は内部見積の現在値だけを使います。候補側から単価は変更しません。</p>
        </div>
      </details>
    </div>
  </section>

  <main class="workspace">
    <div id="diagnosisLoading" class="loading">写真判定を読み込み中…</div>
    <iframe id="diagnosisFrame" class="frame" title="BC現場写真診断" src="/bc-field-diagnosis/"></iframe>
    <div id="estimateLoading" class="loading" hidden>内部見積を読み込み中…</div>
    <iframe id="estimateFrame" class="frame" title="BCサービス 内部見積" data-src="/bc-estimate/?v=20260903-001" hidden></iframe>
  </main>
</div>

<script>
(() => {
  'use strict';

  const CANDIDATE_KEY = 'bc_estimate_candidates_v1';
  const ESTIMATE_LABELS = {
    install_std: '標準取付',
    remove_std: '既設取外し',
    roof_wall: '屋根置き・壁面など',
    pipe_ext: '配管延長',
    cover: '化粧カバー追加',
    dedicated: '専用回路',
    volt_change: '100V / 200V 電圧切替',
    hole: '穴あけ追加',
    wire_ext: '配線延長'
  };

  const el = id => document.getElementById(id);
  const diagnosisFrame = el('diagnosisFrame');
  const estimateFrame = el('estimateFrame');
  const diagnosisBridge = el('diagnosisBridge');
  const estimateBridge = el('estimateBridge');
  const tabDiagnosis = el('tabDiagnosis');
  const tabEstimate = el('tabEstimate');
  let currentView = 'diagnosis';
  let estimateLoaded = false;

  function childDoc(frame){
    try { return frame.contentDocument || frame.contentWindow.document; }
    catch (_) { return null; }
  }

  function checkedValue(doc, name){
    const node = doc && doc.querySelector(`input[name="${name}"]:checked`);
    return node ? node.value : '';
  }

  function checkedValues(doc, name){
    return doc ? Array.from(doc.querySelectorAll(`input[name="${name}"]:checked`)).map(x => x.value) : [];
  }

  function numberValue(id){
    const raw = el(id).value.trim();
    if(raw === '') return null;
    const n = Number(raw);
    return Number.isFinite(n) && n >= 0 ? n : null;
  }

  function addCandidate(list, catalogId, qty, reason){
    if(!ESTIMATE_LABELS[catalogId] || !(qty > 0)) return;
    const existing = list.find(x => x.catalogId === catalogId);
    if(existing){
      existing.qty = Math.max(existing.qty, qty);
      if(reason && !existing.reason.includes(reason)) existing.reason += ` / ${reason}`;
      return;
    }
    list.push({
      catalogId,
      label: ESTIMATE_LABELS[catalogId],
      qty,
      reason,
      accepted: false
    });
  }

  function readDiagnosisSnapshot(){
    const doc = childDoc(diagnosisFrame);
    if(!doc) throw new Error('写真判定画面をまだ読み取れません。');
    const caseName = doc.getElementById('case-name')?.value?.trim() || '';
    const siteMemo = doc.getElementById('site-memo')?.value?.trim() || '';
    const workType = checkedValue(doc, 'workType');
    const dedicatedCircuit = checkedValue(doc, 'dedicatedCircuit');
    const acVoltage = checkedValue(doc, 'acVoltage');
    const wiringRoute = checkedValue(doc, 'wiringRoute');
    const wireDistanceRaw = doc.getElementById('wire-distance')?.value ?? '';
    const wireDistance = wireDistanceRaw === '' ? null : Number(wireDistanceRaw);
    const wireDistanceUnknown = !!doc.getElementById('wire-distance-unknown')?.checked;
    const outdoor = checkedValues(doc, 'outdoor');
    return {caseName, siteMemo, workType, dedicatedCircuit, acVoltage, wiringRoute, wireDistance, wireDistanceUnknown, outdoor};
  }

  function buildCandidatePayload(){
    const source = readDiagnosisSnapshot();
    const explicitInstall = numberValue('installCount');
    const explicitRemove = numberValue('removeCount');
    const pipeExtensionM = numberValue('pipeExtension') || 0;
    const billableWireM = numberValue('billableWire') || 0;
    const explicitHole = numberValue('holeCount');
    const coverLengthM = numberValue('coverLength');
    const coverFittingsCount = numberValue('coverFittings') || 0;
    const highWorkDetail = el('highWorkDetail').value;

    let installCount = explicitInstall;
    let removeCount = explicitRemove;
    if(installCount === null){
      installCount = (source.workType === 'エアコン新設' || source.workType === 'エアコン交換') ? 1 : 0;
    }
    if(removeCount === null){
      removeCount = source.workType === 'エアコン交換' ? 1 : 0;
    }

    const hasHoleCandidate = source.outdoor.includes('穴あけ候補');
    const hasCoverCandidate = source.outdoor.includes('化粧カバー候補');
    const hasHighCandidate = source.outdoor.includes('高所作業候補');
    const holeCount = explicitHole === null ? (hasHoleCandidate ? 1 : 0) : explicitHole;

    const candidates = [];
    addCandidate(candidates, 'install_std', installCount, `工事種別: ${source.workType || '未選択'}`);
    addCandidate(candidates, 'remove_std', removeCount, 'エアコン交換の取外し候補');

    if(source.workType === '専用コンセント新設' || source.dedicatedCircuit === 'なし'){
      addCandidate(candidates, 'dedicated', 1, source.workType === '専用コンセント新設' ? '工事種別で専用コンセント新設' : '専用回路なし');
    }
    if(source.workType === '電圧切替を含む可能性'){
      addCandidate(candidates, 'volt_change', 1, '工事種別で電圧切替の可能性');
    }
    if(pipeExtensionM > 0) addCandidate(candidates, 'pipe_ext', pipeExtensionM, '標準超過の配管延長');
    if(billableWireM > 0) addCandidate(candidates, 'wire_ext', billableWireM, '課金対象として確認した配線延長');
    if(hasHoleCandidate && holeCount > 0) addCandidate(candidates, 'hole', holeCount, '屋外条件で穴あけ候補');
    if(hasCoverCandidate) addCandidate(candidates, 'cover', 1, '屋外条件で化粧カバー候補');
    if(hasHighCandidate && highWorkDetail === 'roof_wall') addCandidate(candidates, 'roof_wall', 1, '高所区分を「屋根置き・壁面など」と確認');

    const materials = [];
    const unresolved = [];
    const needsDedicated = candidates.some(x => x.catalogId === 'dedicated');

    if(needsDedicated){
      const wiringQty = (Number.isFinite(source.wireDistance) && !source.wireDistanceUnknown && source.wireDistance > 0) ? source.wireDistance : (billableWireM || null);
      materials.push({name:'配線材', qty:wiringQty, unit:'m', note:'電線サイズは自動確定しない'});
      materials.push({name:'ブレーカー', qty:1, unit:'個', note:'定格・種類は現地確認'});
      materials.push({name:'専用コンセント', qty:1, unit:'個', note:'形状・定格は現地確認'});
      if(source.wiringRoute === '露出配線になりそう') materials.push({name:'配線保護材', qty:wiringQty, unit:'m', note:'ルート確定後に数量確認'});
      unresolved.push('電線サイズ・遮断器定格・施工可否は現地確認後に確定');
    }
    if(hasHoleCandidate) materials.push({name:'貫通処理材', qty:holeCount || null, unit:'箇所分', note:'壁材・貫通条件を現地確認'});
    if(hasCoverCandidate){
      materials.push({name:'化粧カバー直管', qty:coverLengthM, unit:'m', note:'実測値を確認'});
      materials.push({name:'化粧カバー曲がり等', qty:coverFittingsCount || null, unit:'個', note:'種類別の内訳は現地確認'});
      if(!(coverLengthM > 0)) unresolved.push('化粧カバー実長が未確認');
    }
    if(hasHighCandidate && !highWorkDetail) unresolved.push('高所作業候補あり。屋根置き・壁面などに該当するか未確認');
    if(source.dedicatedCircuit === '不明' || !source.dedicatedCircuit) unresolved.push('専用回路の有無が未確認');
    if(source.acVoltage === '不明' || !source.acVoltage) unresolved.push('エアコン電源100V/200Vが未確認');
    if(source.wireDistanceUnknown || !Number.isFinite(source.wireDistance)) unresolved.push('総配線距離が未確認。課金対象mとは別扱い');
    if(source.workType === '電圧切替を含む可能性') unresolved.push('電圧切替の可否は測定・現地確認後に確定');
    if(billableWireM > 0 && Number.isFinite(source.wireDistance) && billableWireM > source.wireDistance) unresolved.push('課金対象配線mが総配線距離を超えているため数値確認');

    return {
      type: 'bc_estimate_candidates',
      version: 1,
      sourceApp: 'bc-field-diagnosis',
      createdAt: new Date().toISOString(),
      caseName: source.caseName,
      sourceSnapshot: source,
      quantities: {installCount, removeCount, pipeExtensionM, billableWireM, holeCount, coverLengthM, coverFittingsCount, highWorkDetail},
      candidates,
      materials,
      unresolved: Array.from(new Set(unresolved))
    };
  }

  function savePayload(payload){
    localStorage.setItem(CANDIDATE_KEY, JSON.stringify(payload));
  }

  function loadPayload(){
    try{
      const data = JSON.parse(localStorage.getItem(CANDIDATE_KEY) || 'null');
      return data && data.type === 'bc_estimate_candidates' && data.version === 1 ? data : null;
    }catch(_){ return null; }
  }

  function escapeHtml(value){
    return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }

  function renderPreview(payload, target){
    const c = payload.candidates;
    const candidateHtml = c.length ? c.map(x => `<li>${escapeHtml(x.label)} × ${escapeHtml(x.qty)} <small>(${escapeHtml(x.reason)})</small></li>`).join('') : '<li>見積候補なし</li>';
    const matHtml = payload.materials.length ? payload.materials.map(x => `<li>${escapeHtml(x.name)}: ${x.qty == null ? '数量未確認' : `${escapeHtml(x.qty)}${escapeHtml(x.unit)}`} — ${escapeHtml(x.note)}</li>`).join('') : '<li>部材候補なし</li>';
    const unresolvedHtml = payload.unresolved.length ? payload.unresolved.map(x => `<li>${escapeHtml(x)}</li>`).join('') : '<li>追加の未確認事項なし</li>';
    target.innerHTML = `
      <div class="candidate-box">
        <div class="candidate-head"><b>作成候補 ${c.length}件</b><span>${payload.caseName ? escapeHtml(payload.caseName) : '案件名未入力'}</span></div>
        <div class="split" style="margin-top:8px">
          <div class="mini"><h3>見積候補</h3><ul>${candidateHtml}</ul></div>
          <div class="mini"><h3>部材候補</h3><ul>${matHtml}</ul></div>
        </div>
        <div class="mini" style="margin-top:8px"><h3>未確認事項</h3><ul>${unresolvedHtml}</ul></div>
      </div>`;
  }

  function renderEstimateCandidates(){
    const area = el('candidateArea');
    const payload = loadPayload();
    if(!payload){
      area.innerHTML = '<p class="empty">写真判定候補はまだありません。写真判定側で「見積候補を作成して見積へ」を押してください。</p>';
      return;
    }
    const rows = payload.candidates.length ? payload.candidates.map((x,i) => `
      <label class="candidate-row">
        <input class="candidate-check" type="checkbox" data-index="${i}" ${x.accepted ? 'checked' : ''}>
        <span>
          <span class="candidate-name">${escapeHtml(x.label)} × ${escapeHtml(x.qty)}</span>
          <span class="candidate-meta">${escapeHtml(x.reason)}。単価は内部見積の現在値を使用。</span>
        </span>
      </label>`).join('') : '<p class="empty">現在の入力から見積項目候補は出ていません。</p>';
    const mats = payload.materials.length ? payload.materials.map(x => `<li>${escapeHtml(x.name)}: ${x.qty == null ? '数量未確認' : `${escapeHtml(x.qty)}${escapeHtml(x.unit)}`} — ${escapeHtml(x.note)}</li>`).join('') : '<li>部材候補なし</li>';
    const unresolved = payload.unresolved.length ? payload.unresolved.map(x => `<li>${escapeHtml(x)}</li>`).join('') : '<li>追加の未確認事項なし</li>';
    area.innerHTML = `
      <div class="candidate-box">
        <div class="candidate-head"><b>写真判定候補 ${payload.candidates.length}件</b><span>${payload.caseName ? escapeHtml(payload.caseName) : '案件名未入力'} / ${new Date(payload.createdAt).toLocaleString('ja-JP')}</span></div>
        <div class="candidate-list">${rows}</div>
      </div>
      <div class="split">
        <div class="mini"><h3>部材候補（見積へ自動加算しない）</h3><ul>${mats}</ul></div>
        <div class="mini"><h3>未確認事項</h3><ul>${unresolved}</ul></div>
      </div>`;
    area.querySelectorAll('.candidate-check').forEach(check => {
      check.addEventListener('change', async () => {
        const fresh = loadPayload();
        if(!fresh) return;
        const index = Number(check.dataset.index);
        const candidate = fresh.candidates[index];
        if(!candidate) return;
        check.disabled = true;
        try{
          await ensureEstimateLoaded();
          applyCandidateToEstimate(candidate, check.checked);
          candidate.accepted = check.checked;
          fresh.candidates[index] = candidate;
          savePayload(fresh);
          el('estimateStatus').textContent = check.checked ? `${candidate.label}を見積へ反映しました。金額は見積側の現在単価です。` : `${candidate.label}を見積から外しました。`;
          el('estimateStatus').className = 'status ok';
        }catch(err){
          check.checked = !check.checked;
          el('estimateStatus').textContent = err.message || '見積への反映に失敗しました。';
          el('estimateStatus').className = 'status warn';
        }finally{ check.disabled = false; }
      });
    });
  }

  function findEstimateRow(label){
    const doc = childDoc(estimateFrame);
    if(!doc) return null;
    const check = Array.from(doc.querySelectorAll('#catalog input[type="checkbox"][aria-label]')).find(x => x.getAttribute('aria-label') === label);
    return check ? {check, row: check.closest('.item')} : null;
  }

  function applyCandidateToEstimate(candidate, checked){
    const found = findEstimateRow(candidate.label);
    if(!found || !found.row) throw new Error(`内部見積に「${candidate.label}」が見つかりません。料金マスターや項目名は変更していません。`);
    const qty = found.row.querySelector('.qty');
    if(qty && candidate.qty != null){
      qty.value = String(candidate.qty);
      qty.dispatchEvent(new Event('input', {bubbles:true}));
    }
    if(found.check.checked !== checked){
      found.check.checked = checked;
      found.check.dispatchEvent(new Event('change', {bubbles:true}));
    }
  }

  function ensureEstimateLoaded(){
    if(estimateLoaded && childDoc(estimateFrame)?.getElementById('catalog')) return Promise.resolve();
    if(!estimateFrame.getAttribute('src')) estimateFrame.src = estimateFrame.dataset.src;
    return new Promise((resolve,reject) => {
      const deadline = Date.now() + 12000;
      const timer = setInterval(() => {
        if(childDoc(estimateFrame)?.getElementById('catalog')){
          clearInterval(timer); estimateLoaded = true; resolve();
        }else if(Date.now() > deadline){
          clearInterval(timer); reject(new Error('内部見積の読み込みを確認できませんでした。'));
        }
      }, 150);
    });
  }

  function switchView(view){
    currentView = view;
    const showEstimate = view === 'estimate';
    tabDiagnosis.setAttribute('aria-selected', String(!showEstimate));
    tabEstimate.setAttribute('aria-selected', String(showEstimate));
    diagnosisFrame.hidden = showEstimate;
    estimateFrame.hidden = !showEstimate;
    diagnosisBridge.hidden = showEstimate;
    estimateBridge.hidden = !showEstimate;
    el('diagnosisLoading').hidden = showEstimate || !!childDoc(diagnosisFrame)?.getElementById('case-name');
    el('estimateLoading').hidden = !showEstimate || estimateLoaded;
    if(showEstimate){
      if(!estimateFrame.getAttribute('src')) estimateFrame.src = estimateFrame.dataset.src;
      renderEstimateCandidates();
    }
    history.replaceState(null, '', `?view=${showEstimate ? 'estimate' : 'diagnosis'}`);
  }

  diagnosisFrame.addEventListener('load', () => {
    el('diagnosisLoading').hidden = true;
  });
  estimateFrame.addEventListener('load', () => {
    estimateLoaded = true;
    el('estimateLoading').hidden = true;
    renderEstimateCandidates();
  });

  tabDiagnosis.addEventListener('click', () => switchView('diagnosis'));
  tabEstimate.addEventListener('click', () => switchView('estimate'));

  el('previewCandidatesBtn').addEventListener('click', () => {
    try{
      const payload = buildCandidatePayload();
      const holder = document.createElement('div');
      renderPreview(payload, holder);
      const body = diagnosisBridge.querySelector('.bridge-body');
      const old = body.querySelector('.preview-holder');
      if(old) old.remove();
      holder.className = 'preview-holder';
      body.insertBefore(holder, body.querySelector('.actions'));
      el('diagnosisStatus').textContent = '候補を確認しました。まだ保存・見積反映はしていません。';
      el('diagnosisStatus').className = 'status ok';
    }catch(err){
      el('diagnosisStatus').textContent = err.message || '写真判定の入力を読み取れませんでした。';
      el('diagnosisStatus').className = 'status warn';
    }
  });

  el('createCandidatesBtn').addEventListener('click', () => {
    try{
      const payload = buildCandidatePayload();
      savePayload(payload);
      el('diagnosisStatus').textContent = `写真判定候補 ${payload.candidates.length}件を保存しました。見積側では未チェック状態です。`;
      el('diagnosisStatus').className = 'status ok';
      switchView('estimate');
    }catch(err){
      el('diagnosisStatus').textContent = err.message || '候補作成に失敗しました。';
      el('diagnosisStatus').className = 'status warn';
    }
  });

  el('clearCandidatesBtn').addEventListener('click', () => {
    localStorage.removeItem(CANDIDATE_KEY);
    renderEstimateCandidates();
    el('estimateStatus').textContent = '候補データだけ削除しました。内部見積の選択・単価は変更していません。';
    el('estimateStatus').className = 'status ok';
  });

  const initialView = new URLSearchParams(location.search).get('view') === 'estimate' ? 'estimate' : 'diagnosis';
  switchView(initialView);
})();
</script>
</body>
</html>
